<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Preventive Checklist - Data Entry</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:'Segoe UI',Roboto,Arial,sans-serif}
body{background:#f5f3ef;min-height:100vh}
.hdr{background:linear-gradient(180deg,#0a7d86 0%,#00565c 48%,#004448 100%);padding:14px 16px 12px;text-align:center;border-bottom:4px solid #004448;box-shadow:0 5px 18px rgba(0,40,44,.42)}


.hdr-text{color:#fff;font-size:16px;font-weight:800;letter-spacing:.5px}
.hdr-sub{color:rgba(255,255,255,.7);font-size:12px;margin-top:2px}
.wrap{max-width:760px;margin:28px auto;padding:0 20px}
.back-link{display:inline-block;color:#005151;font-size:14px;font-weight:600;text-decoration:none;margin-bottom:16px}
.back-link:hover{text-decoration:underline}
.card{background:linear-gradient(160deg,#ffffff 0%,#fbfcfc 60%,#eef4f4 100%);border:1px solid #d7e2e2;border-radius:14px;padding:24px;box-shadow:0 12px 30px rgba(0,40,44,.16),0 3px 8px rgba(0,40,44,.10),inset 0 1px 0 #fff}
.card h2{color:#005151;font-size:20px;font-weight:700;margin-bottom:4px}
.sec-badge{display:inline-block;background:#005151;color:#fff;font-size:13px;font-weight:700;padding:4px 16px;border-radius:16px;margin-bottom:18px}
.field{margin-bottom:16px}
.field label{display:block;color:#333;font-size:14px;font-weight:600;margin-bottom:6px}
.field .req{color:#e53935}
.field input[type=date],.field select{width:100%;padding:10px 12px;border:1px solid #bbb;border-radius:8px;font-size:14px;font-family:inherit;background:#fff}
#ifmWrap{display:none}
.item{background:#fafaf8;border:1px solid #eee;border-radius:8px;padding:12px 14px;margin-bottom:10px}
.item .q{color:#333;font-size:14px;font-weight:600;line-height:1.4}
.item .q .req{color:#e53935}
.opts{display:flex;gap:18px;margin-top:9px}
.opt{display:flex;align-items:center;gap:6px;font-size:14px;font-weight:600;cursor:pointer}
.opt input{width:16px;height:16px;cursor:pointer}
.opt .ok{color:#2e7d32}
.opt .nok{color:#e53935}
.problem-box{display:none;margin-top:9px}
.pb-field{margin-top:8px}
.pb-field label{display:block;color:#b23c17;font-size:13px;font-weight:600;margin-bottom:4px}
.problem-box textarea{width:100%;padding:10px 12px;border:1px solid #bbb;border-radius:8px;font-size:14px;font-family:inherit;resize:vertical;min-height:44px;box-sizing:border-box}
.actions{display:flex;gap:12px;margin-top:20px;flex-wrap:wrap}
.submit-btn{background:linear-gradient(180deg,#0a7d86,#00565c);color:#fff;border:none;padding:12px 28px;border-radius:10px;font-size:15px;font-weight:700;cursor:pointer;transition:all .2s;box-shadow:0 6px 14px rgba(0,40,44,.28),inset 0 1px 0 rgba(255,255,255,.3)}
.submit-btn:hover{background:linear-gradient(180deg,#0f96a1,#006868);transform:translateY(-2px);box-shadow:0 10px 22px rgba(0,40,44,.36),inset 0 1px 0 rgba(255,255,255,.3)}
.submit-btn:active{transform:scale(.97);box-shadow:0 2px 6px rgba(0,40,44,.2)}
.clear-btn{background:#eee;color:#555;border:none;padding:12px 22px;border-radius:8px;font-size:14px;font-weight:600;cursor:pointer}
.clear-btn:hover{background:#ddd}
.success-msg{display:none;background:#2e7d32;color:#fff;padding:16px;border-radius:8px;text-align:center;font-size:16px;font-weight:600;margin-top:16px}
.error-msg{display:none;background:#e53935;color:#fff;padding:12px;border-radius:8px;text-align:center;font-size:14px;font-weight:600;margin-top:12px}
</style>
</head>
<body>
<div class="hdr">
<div class="hdr-text">AKIJ LIGHT ENGINEERING LTD.</div>
<div class="hdr-sub">Maintenance Management System</div>
</div>
<div class="wrap">
<a href="index.html" class="back-link">&larr; Back to Dashboard</a>
<div class="card">
<h2>Preventive Data Entry</h2>
<div class="sec-badge" id="secBadge">IMM</div>
<div class="field">
<label>Date <span class="req">*</span></label>
<input type="date" id="fDate" required="">
</div>
<div class="field">
<label>Machine Name <span class="req">*</span></label>
<select id="fMachine" required="">
<option value="">-- Select Machine --</option>
</select>
</div>
<div class="field" id="ifmWrap">
<label>Machine Name (Other)</label>
<input type="text" id="fOtherMachine" placeholder="Type the machine name">
</div>
<div id="items"></div>
<div class="actions">
<button type="button" class="submit-btn" id="submitBtn">Submit</button>
<button type="button" class="clear-btn" id="clearBtn">Clear form</button>
</div>
<div class="success-msg" id="succMsg">Checklist submitted successfully!</div>
<div class="error-msg" id="errMsg"></div>
</div>
</div>
<script>
var CONFIGS={
'IMM':{
action:'https://docs.google.com/forms/u/0/d/e/1FAIpQLSf-7t7TnOfNZiX4ZKFKLN37SmAxdNDBnCBjH1bJTy761prpZA/formResponse',
dateEntry:'entry.320623283',
machEntry:'entry.1988329670',
machines:["IMM-360T-PP-A1","IMM-300T-PP-A2","IMM-258T-PP-A3","IMM-250T-PP-A4","IMM-250T-PP-A5","IMM-120T-PP-B1","IMM-208T-PP-B2","IMM-200T-PP-B3","IMM-168T-PP-B4","IMM-128T-PP-B5","IMM-160T-PP-B6","IMM-160T-PP-B7"],
items:[["entry.1935773684","Electrical panel board net &amp; clean and ensure inside wiring as per compliance",1],["entry.218005557","Panel exhaust fan, SSR, relay, fuse, MCB check and corrective action",1],["entry.1458090673","Heater, blower and thermocouple check and corrective action",1],["entry.940823359","Gate safety, limit switch, sensor check and corrective action",1],["entry.1485189514","Must ensure machine breaker knob active and working properly",1],["entry.542758492","Machine Transducer check properly",1],["entry.569862239","Machine front and back side emergency switch check and corrective action",1],["entry.1277314249","MMI board key pad check",1],["entry.30582981","Cables, terminals &amp; connections check for heat, damage or looseness",1],["entry.1317825503","Panel cooling fan / ventilation &amp; compartment cleanliness check",1],["entry.1517800487","Ensure machine system pressure and flow are OK",1],["entry.1412437944","Suction filter clean",1],["entry.1062724479","Inverter cooling system check and corrective action",1],["entry.1700644856","Lubrication distributors check",1],["entry.867299511","Lubrication check in toggle pin &amp; bush",1],["entry.490902443","Tie bar scratch check and measure the gap",1],["entry.1572939011","Machine level check by spirit level",1],["entry.1648505022","Nut &amp; Bolt check",1],["entry.1912192025","Machine gate spring, stopper, etc. check and corrective action",0],["entry.1073228339","Lubrication pump filter clean",1],["entry.1501232017","Purge guard limit, rod, cover, glass check and corrective action",1],["entry.1169424761","Oil cooler clean properly with nylon brush",1],["entry.1025988752","If hydraulic oil needs to be poured (top-up)",1],["entry.86892409","Water header IN/OUT line check",1],["entry.982157472","Hopper, nut bolt, clamp check &amp; corrective action",1],["entry.528482425","Hopper drier blower, heater, controlling check and corrective action",1],["entry.1351057645","Machine all jam nut check with cotter bolt",1],["entry.253109376","Unwanted noise find out in hydraulic system, motor and pump to solve",1],["entry.436504984","Wastage oil and water clean",1],["entry.1783376924","Injection unit nozzle centering &amp; alignment check",1],["entry.1561889870","Total machine clean",1],["entry.1157330180","Emergency stop (E-Stop) button functioning test",1],["entry.137137975","Safety guards, interlocks &amp; light curtains functional",1],["entry.1189099842","Lockout / Tagout (LOTO) used",1],["entry.1147334062","Spill, oil leakage &amp; housekeeping around machine checked",1],["entry.33958766","Operator PPE compliance &amp; machine area clear of obstructions",1]]
},
'Crusher Machine':{
action:'https://docs.google.com/forms/u/0/d/e/1FAIpQLSdoqG64cZouG-LtD3S880kxWFWkYw229-K2tmQDbp3rs_pbiQ/formResponse',
dateEntry:'entry.1778354468',
machEntry:'entry.32283903',
dateIsText:true,
machines:["CRUSHER-01","CRUSHER-02","CRUSHER-03","CRUSHER-04","CRUSHER-05"],
items:[["entry.25945622","Inspect and sharpen/replace crusher blades if required",1],["entry.291076681","Check rotor condition and balance",1],["entry.1582392752","Inspect bearings for wear or damage",1],["entry.1143959351","Check motor insulation and electrical connections",1],["entry.993930812","Inspect starter, contactor, overload relay and MCCB",1],["entry.612251010","Check machine vibration level",1],["entry.1173310102","Check gearbox",1],["entry.859116582","Inspect machine foundation and frame structure",1],["entry.639850536","Test all safety interlocks and emergency stops",1],["entry.15945324","Machine Overall Clean",1]]
},
'Mixture Machine':{
action:'https://docs.google.com/forms/u/0/d/e/1FAIpQLSfbh1sphfVJ7fIntCF78WvDE747-6iDsrs8yJBLlmnlNgZArg/formResponse',
dateEntry:'entry.572986135',
machEntry:'entry.1179478552',
dateIsText:true,
machines:["MIXER-01","MIXER-02","MIXER-03","MIXER-04","MIXER-05"],
items:[["entry.1067966832","Clean the complete machine and surrounding area",1],["entry.1306267569","Check blade condition, wear, cracks, and tightness",1],["entry.828176313","Check abnormal noise, vibration, overheating, and mounting bolts",1],["entry.421611375","Inspect bearing condition",1],["entry.234644535","Check and tighten all mounting bolts and fasteners",1],["entry.1806184471","Check for abnormal noise, temperature, and lubrication",1],["entry.1486472584","Clean panel and inspect wiring and terminals",1],["entry.1631916358","Check for loose, burnt, or damaged connections",1],["entry.808687803","Test Start, Stop, Emergency Stop, and selector switches",1],["entry.1425250348","Check all guards and safety covers are properly installed",1],["entry.1365680326","Check for abnormal vibration during operation",1],["entry.317457594","Run the machine and observe overall performance",1]]
},
'Central Feeding':{
action:'https://docs.google.com/forms/u/0/d/e/1FAIpQLScBeUGEQnx5sNV_pbrui3BCmDuC_xoakuDd-Lrd4mHeoMePZg/formResponse',
dateEntry:'entry.2062423625',
machEntry:'entry.1320877788',
dateIsText:true,
machines:["Central Feeding System"],
items:[["entry.2125603407","Check overall condition, abnormal noise, vibration, and overheating",1],["entry.9823356","Check motor current, terminals, insulation, and cooling fan",1],["entry.1901976774","Clean or replace the filter element if required",1],["entry.1489135542","Check vacuum pressure and system performance",1],["entry.107791415","Check pipe condition, joints, bends, and internal blockage",1],["entry.352826115","Inspect loader operation and material suction performance",1],["entry.393799248","Clean filter and check for damage",1],["entry.262856171","Check operation, air leakage, and material flow",1],["entry.872348639","Clean panel and inspect wiring, terminals, and components",1],["entry.732207880","Check alarms, communication, and operational status",1],["entry.841024253","Test all safety devices and emergency functions",1],["entry.53986293","Clean dust, material particles, and contamination from the system",1],["entry.1318918471","Run trial and confirm smooth material feeding to all machines",1],["entry.1769435750","Clean hopper and check heating/drying performance",1],["entry.411596872","Check heater condition, temperature controller, and wiring",1]]
}
};
var sec=new URLSearchParams(location.search).get('section')||'IMM';
var CFG=CONFIGS[sec]||CONFIGS['IMM'];
document.getElementById('secBadge').textContent=sec;
document.title='Preventive Data Entry - '+sec;
var ITEMS=CFG.items,MACHINES=CFG.machines,FORM_ACTION=CFG.action;
var itemsHost=document.getElementById('items');
ITEMS.forEach(function(it){
  var box=document.createElement('div');box.className='item';
  var q=document.createElement('div');q.className='q';
  q.innerHTML=(it[2]?it[1]+' <span class="req">*</span>':it[1]);
  var opts=document.createElement('div');opts.className='opts';
  var ok=document.createElement('label');ok.className='opt';
  ok.innerHTML='<input type="radio" name="'+it[0]+'" value="ok"><span class="ok">OK</span>';
  var nok=document.createElement('label');nok.className='opt';
  nok.innerHTML='<input type="radio" name="'+it[0]+'" value="nok"><span class="nok">Not OK</span>';
  var pb=document.createElement('div');pb.className='problem-box';
  var pb1=document.createElement('div');pb1.className='pb-field';
  var l1=document.createElement('label');l1.textContent='Describe the problem';
  var ta=document.createElement('textarea');ta.placeholder='Describe the problem';
  pb1.appendChild(l1);pb1.appendChild(ta);
  var pb2=document.createElement('div');pb2.className='pb-field';
  var l2=document.createElement('label');l2.textContent='Corrective action';
  var ta2=document.createElement('textarea');ta2.placeholder='Corrective action';
  pb2.appendChild(l2);pb2.appendChild(ta2);
  pb.appendChild(pb1);pb.appendChild(pb2);
  var rads=[ok.querySelector('input'),nok.querySelector('input')];
  rads.forEach(function(r){
    r.addEventListener('change',function(){
      pb.style.display=(nok.querySelector('input').checked)?'block':'none';
      if(r.value==='nok')ta.focus();    });
  });
  opts.appendChild(ok);opts.appendChild(nok);
  box.appendChild(q);box.appendChild(opts);box.appendChild(pb);
  itemsHost.appendChild(box);
});
var mach=document.getElementById('fMachine'),machWrap=document.getElementById('ifmWrap');
MACHINES.forEach(function(m){var o=document.createElement('option');o.value=m;o.textContent=m;mach.appendChild(o)});
var oo=document.createElement('option');oo.value='__other__';oo.textContent='Other (type manually)';mach.appendChild(oo);
mach.addEventListener('change',function(){
  if(mach.value==='__other__'){machWrap.style.display='block';document.getElementById('fOtherMachine').focus()}
  else{machWrap.style.display='none'}
});
function resetForm(){
  document.querySelectorAll('#items input[type=radio]').forEach(function(r){r.checked=false});
  document.querySelectorAll('#items .problem-box').forEach(function(p){p.style.display='none';p.querySelectorAll('textarea').forEach(function(t){t.value=''})});
  document.getElementById('ifmWrap').style.display='none';
  document.getElementById('fMachine').value='';
  document.getElementById('fOtherMachine').value='';
  document.getElementById('fDate').value=new Date().toISOString().split('T')[0];
}
function buildPayload(){
  var payload={};
  var firstMissing='';
  ITEMS.forEach(function(it){
    var input=document.querySelector('input[name="'+it[0]+'"]:checked');
    if(!input){
      if(it[2]&&!firstMissing)firstMissing=it[1].replace(/<[^>]*>/g,'');
      return;
    }
    if(input.value==='ok'){payload[it[0]]='OK'}
    else{
      var names=document.querySelectorAll('input[name="'+it[0]+'"]');
      var box=names[0].closest('.item').querySelector('.problem-box');
      var tas=box.querySelectorAll('textarea');
      var prob=tas[0].value.trim();
      var action=tas[1].value.trim();
      var text=prob;
      if(action)text+=text?(' | Corrective action: '+action):('Corrective action: '+action);
      payload[it[0]]=text?('Not OK - '+text):'Not OK';
    }
  });
  var dv=document.getElementById('fDate').value;
  if(dv){
    if(CFG.dateIsText){
      payload[CFG.dateEntry]=dv;
    }else{
      var dp=dv.split('-');
      payload[CFG.dateEntry+'_year']=dp[0];
      payload[CFG.dateEntry+'_month']=String(parseInt(dp[1],10));
      payload[CFG.dateEntry+'_day']=String(parseInt(dp[2],10));
    }
  }
  if(mach.value==='__other__'){
    payload[CFG.machEntry+'.other_option_response']=document.getElementById('fOtherMachine').value.trim();
  }else{
    payload[CFG.machEntry]=mach.value;
  }
  payload['fvv']='1';
  return {payload:payload,firstMissing:firstMissing};
}
var errMsg=document.getElementById('errMsg'),succMsg=document.getElementById('succMsg');
document.getElementById('submitBtn').addEventListener('click',function(){
  errMsg.style.display='none';succMsg.style.display='none';
  if(!mach.value){
    errMsg.textContent='Please select a Machine';errMsg.style.display='block';return;
  }
  if(mach.value==='__other__'&&!document.getElementById('fOtherMachine').value.trim()){
    errMsg.textContent='Please type the machine name';errMsg.style.display='block';return;
  }
  if(!document.getElementById('fDate').value){
    errMsg.textContent='Please enter the Date';errMsg.style.display='block';return;
  }
  var res=buildPayload();
  if(res.firstMissing){
    errMsg.textContent='Please select OK or Not OK for: '+res.firstMissing;
    errMsg.style.display='block';return;
  }
  var body=Object.keys(res.payload).map(function(k){
    return encodeURIComponent(k)+'='+encodeURIComponent(res.payload[k]);
  }).join('&');
  fetch(FORM_ACTION,{
    method:'POST',
    mode:'no-cors',
    headers:{'Content-Type':'application/x-www-form-urlencoded'},
    body:body
  }).then(function(){
    succMsg.style.display='block';
  }).catch(function(){
    errMsg.textContent='Network error. Please try again.';errMsg.style.display='block';return;
  });
  resetForm();
  setTimeout(function(){succMsg.style.display='none'},5000);
  window.scrollTo(0,0);
});
document.getElementById('clearBtn').addEventListener('click',function(){errMsg.style.display='none';succMsg.style.display='none';resetForm()});
document.getElementById('fDate').value=new Date().toISOString().split('T')[0];
</script>
</body>
</html>
