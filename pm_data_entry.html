<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IMM Preventive Checklist - Data Entry</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:'Segoe UI',Roboto,Arial,sans-serif}
body{background:#f5f3ef;min-height:100vh}
.hdr{background:#005151;padding:14px 16px 10px;text-align:center;border-bottom:3px solid #003838}
.hdr-text{color:#fff;font-size:17px;font-weight:700;letter-spacing:.5px}
.hdr-sub{color:rgba(255,255,255,.7);font-size:12px;margin-top:2px}
.wrap{max-width:760px;margin:28px auto;padding:0 20px}
.back-link{display:inline-block;color:#005151;font-size:14px;font-weight:600;text-decoration:none;margin-bottom:16px}
.back-link:hover{text-decoration:underline}
.card{background:#fff;border:1px solid #ddd;border-radius:12px;padding:24px;box-shadow:0 4px 16px rgba(0,81,81,.08)}
.card h2{color:#005151;font-size:20px;font-weight:700;margin-bottom:4px}
.sec-badge{display:inline-block;background:#005151;color:#fff;font-size:13px;font-weight:700;padding:4px 16px;border-radius:16px;margin-bottom:18px}
.field{margin-bottom:16px}
.field label{display:block;color:#333;font-size:14px;font-weight:600;margin-bottom:6px}
.field .req{color:#e53935}
.field input[type=date],.field select,.field textarea{width:100%;padding:10px 12px;border:1px solid #bbb;border-radius:8px;font-size:14px;font-family:inherit;background:#fff}
.field textarea{resize:vertical;min-height:52px}
#ifmWrap{display:none}
.actions{display:flex;gap:12px;margin-top:20px;flex-wrap:wrap}
.submit-btn{background:#005151;color:#fff;border:none;padding:12px 28px;border-radius:8px;font-size:15px;font-weight:700;cursor:pointer;transition:all .2s}
.submit-btn:hover{background:#006868;transform:scale(1.02)}
.submit-btn:active{transform:scale(.97)}
.clear-btn{background:#eee;color:#555;border:none;padding:12px 22px;border-radius:8px;font-size:14px;font-weight:600;cursor:pointer}
.clear-btn:hover{background:#ddd}
.success-msg{display:none;background:#2e7d32;color:#fff;padding:16px;border-radius:8px;text-align:center;font-size:16px;font-weight:600;margin-top:16px}
.error-msg{display:none;background:#e53935;color:#fff;padding:12px;border-radius:8px;text-align:center;font-size:14px;font-weight:600;margin-top:12px}
.hint{color:#777;font-size:12px;margin-top:4px}
</style>
</head>
<body>
<div class="hdr">
<div class="hdr-text">AKIJ LIGHT ENGINEERING LTD.</div>
<div class="hdr-sub">Maintenance Management System</div>
</div>
<div class="wrap">
<a href="index.html" class="back-link">&larr; Back to Dashboard</a>
<div class="card">
<h2>Preventive Data Entry</h2>
<div class="sec-badge" id="secBadge">IMM Inhouse</div>
<form id="mainForm" method="POST">
<div class="field">
<label>Date <span class="req">*</span></label>
<input type="date" name="entry.320623283" id="fDate" required="">
</div>
<div class="field">
<label>Machine Name <span class="req">*</span></label>
<select name="entry.1935773684" id="fMachine" required="">
<option value="">-- Select Machine --</option>
</select>
</div>
<div class="field" id="ifmWrap">
<label>Machine Name (Other)</label>
<input type="text" id="fOtherMachine" placeholder="Type the machine name">
</div>
<div class="field">
<label>Electrical panel board net &amp; clean and ensure inside wiring as per compliance <span class="req">*</span></label>
<textarea name="entry.218005557" required=""></textarea>
</div>
<div class="field">
<label>Panel exhaust fan, SSR, relay, fuse, MCB check and corrective action <span class="req">*</span></label>
<textarea name="entry.1458090673" required=""></textarea>
</div>
<div class="field">
<label>Heater, blower and thermocouple check and corrective action <span class="req">*</span></label>
<textarea name="entry.940823359" required=""></textarea>
</div>
<div class="field">
<label>Gate safety, limit switch, sensor check and corrective action <span class="req">*</span></label>
<textarea name="entry.1485189514" required=""></textarea>
</div>
<div class="field">
<label>Must ensure machine breaker knob active and working properly <span class="req">*</span></label>
<textarea name="entry.542758492" required=""></textarea>
</div>
<div class="field">
<label>Machine Transducer check properly <span class="req">*</span></label>
<textarea name="entry.569862239" required=""></textarea>
</div>
<div class="field">
<label>Machine front and back side emergency switch check and corrective action <span class="req">*</span></label>
<textarea name="entry.1277314249" required=""></textarea>
</div>
<div class="field">
<label>MMI board key pad check <span class="req">*</span></label>
<textarea name="entry.30582981" required=""></textarea>
</div>
<div class="field">
<label>Cables, terminals &amp; connections check for heat, damage or looseness <span class="req">*</span></label>
<textarea name="entry.1317825503" required=""></textarea>
</div>
<div class="field">
<label>Panel cooling fan / ventilation &amp; compartment cleanliness check <span class="req">*</span></label>
<textarea name="entry.1517800487" required=""></textarea>
</div>
<div class="field">
<label>Ensure machine system pressure and flow are OK <span class="req">*</span></label>
<textarea name="entry.1412437944" required=""></textarea>
</div>
<div class="field">
<label>Suction filter clean <span class="req">*</span></label>
<textarea name="entry.1062724479" required=""></textarea>
</div>
<div class="field">
<label>Inverter cooling system check and corrective action <span class="req">*</span></label>
<textarea name="entry.1700644856" required=""></textarea>
</div>
<div class="field">
<label>Lubrication distributors check <span class="req">*</span></label>
<textarea name="entry.867299511" required=""></textarea>
</div>
<div class="field">
<label>Lubrication check in toggle pin &amp; bush <span class="req">*</span></label>
<textarea name="entry.490902443" required=""></textarea>
</div>
<div class="field">
<label>Tie bar scratch check and measure the gap <span class="req">*</span></label>
<textarea name="entry.1572939011" required=""></textarea>
</div>
<div class="field">
<label>Machine level check by spirit level <span class="req">*</span></label>
<textarea name="entry.1648505022" required=""></textarea>
</div>
<div class="field">
<label>Nut &amp; Bolt check <span class="req">*</span></label>
<textarea name="entry.1912192025" required=""></textarea>
</div>
<div class="field">
<label>Machine gate spring, stopper, etc. check and corrective action</label>
<textarea name="entry.1073228339"></textarea>
</div>
<div class="field">
<label>Lubrication pump filter clean <span class="req">*</span></label>
<textarea name="entry.1501232017" required=""></textarea>
</div>
<div class="field">
<label>Purge guard limit, rod, cover, glass check and corrective action <span class="req">*</span></label>
<textarea name="entry.1169424761" required=""></textarea>
</div>
<div class="field">
<label>Oil cooler clean properly with nylon brush <span class="req">*</span></label>
<textarea name="entry.1025988752" required=""></textarea>
</div>
<div class="field">
<label>If hydraulic oil needs to be poured (top-up) <span class="req">*</span></label>
<textarea name="entry.86892409" required=""></textarea>
</div>
<div class="field">
<label>Water header IN/OUT line check <span class="req">*</span></label>
<textarea name="entry.982157472" required=""></textarea>
</div>
<div class="field">
<label>Hopper, nut bolt, clamp check &amp; corrective action <span class="req">*</span></label>
<textarea name="entry.528482425" required=""></textarea>
</div>
<div class="field">
<label>Hopper drier blower, heater, controlling check and corrective action <span class="req">*</span></label>
<textarea name="entry.1351057645" required=""></textarea>
</div>
<div class="field">
<label>Machine all jam nut check with cotter bolt <span class="req">*</span></label>
<textarea name="entry.253109376" required=""></textarea>
</div>
<div class="field">
<label>Unwanted noise find out in hydraulic system, motor and pump to solve <span class="req">*</span></label>
<textarea name="entry.436504984" required=""></textarea>
</div>
<div class="field">
<label>Wastage oil and water clean <span class="req">*</span></label>
<textarea name="entry.1783376924" required=""></textarea>
</div>
<div class="field">
<label>Injection unit nozzle centering &amp; alignment check <span class="req">*</span></label>
<textarea name="entry.1561889870" required=""></textarea>
</div>
<div class="field">
<label>Total machine clean <span class="req">*</span></label>
<textarea name="entry.1157330180" required=""></textarea>
</div>
<div class="field">
<label>Emergency stop (E-Stop) button functioning test <span class="req">*</span></label>
<textarea name="entry.137137975" required=""></textarea>
</div>
<div class="field">
<label>Safety guards, interlocks &amp; light curtains functional <span class="req">*</span></label>
<textarea name="entry.1189099842" required=""></textarea>
</div>
<div class="field">
<label>Lockout / Tagout (LOTO) used <span class="req">*</span></label>
<textarea name="entry.1147334062" required=""></textarea>
</div>
<div class="field">
<label>Spill, oil leakage &amp; housekeeping around machine checked <span class="req">*</span></label>
<textarea name="entry.33958766" required=""></textarea>
</div>
<div class="field">
<label>Operator PPE compliance &amp; machine area clear of obstructions <span class="req">*</span></label>
<textarea name="entry.1988329670" required=""></textarea>
</div>
<div class="actions">
<button type="submit" class="submit-btn" id="submitBtn">Submit</button>
<button type="button" class="clear-btn" id="clearBtn">Clear form</button>
</div>
<div class="success-msg" id="succMsg">Checklist submitted successfully!</div>
<div class="error-msg" id="errMsg"></div>
</form>
</div>
</div>
<script>
var MACHINES=["IMM-360T-PP-A1","IMM-300T-PP-A2","IMM-258T-PP-A3","IMM-250T-PP-A4","IMM-250T-PP-A5","IMM-120T-PP-B1","IMM-208T-PP-B2","IMM-200T-PP-B3","IMM-168T-PP-B4","IMM-128T-PP-B5","IMM-160T-PP-B6","IMM-160T-PP-B7"];
var sec=new URLSearchParams(location.search).get('section')||'IMM Inhouse';
document.getElementById('secBadge').textContent=sec;
document.title='Preventive Data Entry - '+sec;
var mach=document.getElementById('fMachine'),machWrap=document.getElementById('ifmWrap');
MACHINES.forEach(function(m){var o=document.createElement('option');o.value=m;o.textContent=m;mach.appendChild(o)});
var oo=document.createElement('option');oo.value='__other__';oo.textContent='Other (type manually)';mach.appendChild(oo);
mach.addEventListener('change',function(){
  if(mach.value==='__other__'){machWrap.style.display='block';document.getElementById('fOtherMachine').focus()}
  else{machWrap.style.display='none'}
});
var form=document.getElementById('mainForm'),errMsg=document.getElementById('errMsg'),succMsg=document.getElementById('succMsg');
form.addEventListener('submit',function(e){
  errMsg.style.display='none';succMsg.style.display='none';
  var firstErr='';
  Array.prototype.forEach.call(form.querySelectorAll('textarea'),function(t){
    if(t.required&&!t.value.trim()){if(!firstErr)firstErr='Please fill: '+t.parentElement.querySelector('label').textContent.replace(' *','').trim();t.focus()}
  });
  if(firstErr){e.preventDefault();errMsg.textContent=firstErr;errMsg.style.display='block';return}
  if(!mach.value){e.preventDefault();errMsg.textContent='Please select a Machine';errMsg.style.display='block';return}
  var otherVal='';
  if(mach.value==='__other__'){
    otherVal=document.getElementById('fOtherMachine').value.trim();
    if(!otherVal){e.preventDefault();errMsg.textContent='Please type the machine name';errMsg.style.display='block';return}
  }
  e.preventDefault();
  var fd=new FormData(form);
  if(otherVal){
    fd.set('entry.1935773684','__other_option__');
    fd.append('entry.1935773684.other_option_response',otherVal);
  }
  fd.append('fvv','1');
  fd.append('partialResponse','[null,null,"1313122699805347038"]');
  fd.append('pageHistory','0');
  fd.append('draftResponse','[,,]');
  fd.append('fbzx','1313122699805347038');
  var payload={};
  fd.forEach(function(val,key){payload[key]=val});
  var body=Object.keys(payload).map(function(k){
    return encodeURIComponent(k)+'='+encodeURIComponent(payload[k]);
  }).join('&');
  fetch('https://docs.google.com/forms/d/e/1FAIpQLSf-7t7TnOfNZiX4ZKFKLN37SmAxdNDBnCBjH1bJTy761prpZA/formResponse',{
    method:'POST',
    mode:'no-cors',
    headers:{'Content-Type':'application/x-www-form-urlencoded'},
    body:body
  }).then(function(){
    succMsg.style.display='block';
  }).catch(function(){
    errMsg.textContent='Network error. Please try again.';
    errMsg.style.display='block';
    return;
  });
  form.reset();
  machWrap.style.display='none';
  mach.value='';
  document.getElementById('fDate').value=new Date().toISOString().split('T')[0];
  setTimeout(function(){succMsg.style.display='none'},5000);
  window.scrollTo(0,0);
});
document.getElementById('clearBtn').addEventListener('click',function(){form.reset();machWrap.style.display='none';mach.value='';document.getElementById('fDate').value=new Date().toISOString().split('T')[0]});
document.getElementById('fDate').value=new Date().toISOString().split('T')[0];
</script>
</body>
</html>
