<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Preventive Data Entry - Akij Light Engineering Ltd.</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:'Segoe UI',Roboto,Arial,sans-serif}
body{background:#f5f3ef;min-height:100vh}
.hdr{background:#005151;padding:14px 16px 10px;text-align:center;border-bottom:3px solid #003838}
.hdr-text{color:#fff;font-size:17px;font-weight:700;letter-spacing:.5px}
.hdr-sub{color:rgba(255,255,255,.7);font-size:12px;margin-top:2px}
.wrap{max-width:760px;margin:28px auto;padding:0 20px}
.back-link{display:inline-block;color:#005151;font-size:14px;font-weight:600;text-decoration:none;margin-bottom:16px}
.back-link:hover{text-decoration:underline}
.card{background:#fff;border:1px solid #ddd;border-radius:12px;padding:24px;box-shadow:0 4px 16px rgba(0,81,81,.08)}
.card h2{color:#005151;font-size:20px;font-weight:700;margin-bottom:4px}
.sec-badge{display:inline-block;background:#005151;color:#fff;font-size:13px;font-weight:700;padding:4px 16px;border-radius:16px;margin-bottom:18px}
.field{margin-bottom:16px}
.field label{display:block;color:#333;font-size:14px;font-weight:600;margin-bottom:6px}
.field .req{color:#e53935}
.field input[type=date],.field select{width:100%;padding:10px 12px;border:1px solid #bbb;border-radius:8px;font-size:14px;font-family:inherit;background:#fff}
#ifmWrap{display:none}
.item{background:#fafaf8;border:1px solid #eee;border-radius:8px;padding:12px 14px;margin-bottom:10px}
.item .q{color:#333;font-size:14px;font-weight:600;line-height:1.4}
.item .q .req{color:#e53935}
.opts{display:flex;gap:18px;margin-top:9px}
.opt{display:flex;align-items:center;gap:6px;font-size:14px;font-weight:600;cursor:pointer}
.opt input{width:16px;height:16px;cursor:pointer}
.opt .ok{color:#2e7d32}
.opt .nok{color:#e53935}
.problem-box{display:none;margin-top:9px}
.pb-field{margin-top:8px}
.pb-field label{display:block;color:#b23c17;font-size:13px;font-weight:600;margin-bottom:4px}
.problem-box textarea{width:100%;padding:10px 12px;border:1px solid #bbb;border-radius:8px;font-size:14px;font-family:inherit;resize:vertical;min-height:44px;box-sizing:border-box}
.actions{display:flex;gap:12px;margin-top:20px;flex-wrap:wrap}
.submit-btn{background:#005151;color:#fff;border:none;padding:12px 28px;border-radius:8px;font-size:15px;font-weight:700;cursor:pointer;transition:all .2s}
.submit-btn:hover{background:#006868;transform:scale(1.02)}
.submit-btn:active{transform:scale(.97)}
.submit-btn.saving{opacity:.7;cursor:not-allowed}
.clear-btn{background:#eee;color:#555;border:none;padding:12px 22px;border-radius:8px;font-size:14px;font-weight:600;cursor:pointer}
.clear-btn:hover{background:#ddd}
.success-msg{display:none;background:#2e7d32;color:#fff;padding:16px;border-radius:8px;text-align:center;font-size:16px;font-weight:600;margin-top:16px}
.error-msg{display:none;background:#e53935;color:#fff;padding:12px;border-radius:8px;text-align:center;font-size:14px;font-weight:600;margin-top:12px}
</style>
</head>
<body>
<div class="hdr">
<div class="hdr-text">AKIJ LIGHT ENGINEERING LTD.</div>
<div class="hdr-sub">Maintenance Management System</div>
</div>
<div class="wrap">
<a href="index.html" class="back-link">&larr; Back to Dashboard</a>
<div class="card">
<h2>Preventive Data Entry</h2>
<div class="sec-badge" id="secBadge">IMM Inhouse</div>
<div class="field">
<label>Date <span class="req">*</span></label>
<input type="date" id="fDate" required="">
</div>
<div class="field">
<label>Machine Name <span class="req">*</span></label>
<select id="fMachine" required="">
<option value="">-- Select Machine --</option>
</select>
</div>
<div class="field" id="ifmWrap">
<label>Machine Name (Other)</label>
<input type="text" id="fOtherMachine" placeholder="Type the machine name">
</div>
<div id="items"></div>
<div class="actions">
<button type="button" class="submit-btn" id="submitBtn">Submit</button>
<button type="button" class="clear-btn" id="clearBtn">Clear form</button>
</div>
<div class="success-msg" id="succMsg">Checklist submitted successfully!</div>
<div class="error-msg" id="errMsg"></div>
</div>
</div>
<script>
// ============================================================================
// CONFIG — replace WEB_APP_URL with your deployed Apps Script Web App URL
// ============================================================================
// IMPORTANT: replace this with your deployed Apps Script Web App URL.
// See apps-script.gs in the repo and the deployment steps below.
var WEB_APP_URL = 'https://script.google.com/macros/s/AKfycbzidh3a6WXsGel5kfUhtRcUee1tkmFsnMS4T42lMh1n05L1M3kU43kj6CTBV0blP-ur/exec';

// IMM preventive checklist questions (entry.* IDs match the dashboard reader)
var ITEMS=[
["entry.218005557","Electrical panel board net &amp; clean and ensure inside wiring as per compliance",1],
["entry.1458090673","Panel exhaust fan, SSR, relay, fuse, MCB check and corrective action",1],
["entry.940823359","Heater, blower and thermocouple check and corrective action",1],
["entry.1485189514","Gate safety, limit switch, sensor check and corrective action",1],
["entry.542758492","Must ensure machine breaker knob active and working properly",1],
["entry.569862239","Machine Transducer check properly",1],
["entry.1277314249","Machine front and back side emergency switch check and corrective action",1],
["entry.30582981","MMI board key pad check",1],
["entry.1317825503","Cables, terminals &amp; connections check for heat, damage or looseness",1],
["entry.1517800487","Panel cooling fan / ventilation &amp; compartment cleanliness check",1],
["entry.1412437944","Ensure machine system pressure and flow are OK",1],
["entry.1062724479","Suction filter clean",1],
["entry.1700644856","Inverter cooling system check and corrective action",1],
["entry.867299511","Lubrication distributors check",1],
["entry.490902443","Lubrication check in toggle pin &amp; bush",1],
["entry.1572939011","Tie bar scratch check and measure the gap",1],
["entry.1648505022","Machine level check by spirit level",1],
["entry.1912192025","Nut &amp; Bolt check",1],
["entry.1073228339","Machine gate spring, stopper, etc. check and corrective action",0],
["entry.1501232017","Lubrication pump filter clean",1],
["entry.1169424761","Purge guard limit, rod, cover, glass check and corrective action",1],
["entry.1025988752","Oil cooler clean properly with nylon brush",1],
["entry.86892409","If hydraulic oil needs to be poured (top-up)",1],
["entry.982157472","Water header IN/OUT line check",1],
["entry.528482425","Hopper, nut bolt, clamp check &amp; corrective action",1],
["entry.1351057645","Hopper drier blower, heater, controlling check and corrective action",1],
["entry.253109376","Machine all jam nut check with co",1],
["entry.113299393","Gear box oil level check",1],
["entry.683870736","Pump coupling alignment check",1],
["entry.1896518256","Cooling water flow check",1],
["entry.1135300109","Barrel zone temperature check",1],
["entry.184567311","Nozzle heater band check",1],
["entry.1353870519","Screw &amp; barrel wear check",1],
["entry.1601294214","Hydraulic pressure check",1],
["entry.187914540","Oil leakage check",1],
["entry.1432689321","Cooling channel chock check",1],
["entry.198674593","Ejector pin check",1],
["entry.1777680829","Mating surface check",1],
["entry.1380680411","Heater band check",1],
["entry.1445981052","Thermocouple check",1],
["entry.1400622472","SSR / relay check",1],
["entry.1891287459","MCB / fuse check",1],
["entry.1306347633","Motor terminal check",1],
["entry.106112945","Belt tension check",1],
["entry.1476703198","Bearing greasing check",1],
["entry.1827870979","Coupling check",1],
["entry.1513026803","Vibration check",1],
["entry.619704381","Abnormal noise check",1],
["entry.1545389773","Emergency stop check",1],
["entry.1629650568","Safety gate interlock check",1],
["entry.226897682","Lighting &amp; signal check",1],
["entry.1898390452","Earth leakage check",1],
["entry.1402362945","Insulation resistance check",1]
];

var sec = new URLSearchParams(location.search).get('section') || 'IMM Inhouse';
document.getElementById('secBadge').textContent = sec;
document.title = 'Preventive Data Entry - ' + sec;

var itemsHost = document.getElementById('items');
ITEMS.forEach(function (it) {
  var box = document.createElement('div'); box.className = 'item';
  var q = document.createElement('div'); q.className = 'q';
  q.innerHTML = (it[2] ? it[1] + ' <span class="req">*</span>' : it[1]);
  var opts = document.createElement('div'); opts.className = 'opts';
  var ok = document.createElement('label'); ok.className = 'opt';
  ok.innerHTML = '<input type="radio" name="' + it[0] + '" value="ok"><span class="ok">OK</span>';
  var nok = document.createElement('label'); nok.className = 'opt';
  nok.innerHTML = '<input type="radio" name="' + it[0] + '" value="nok"><span class="nok">Not OK</span>';
  var pb = document.createElement('div'); pb.className = 'problem-box';
  var pb1 = document.createElement('div'); pb1.className = 'pb-field';
  var l1 = document.createElement('label'); l1.textContent = 'Describe the problem';
  var ta = document.createElement('textarea'); ta.placeholder = 'Describe the problem';
  pb1.appendChild(l1); pb1.appendChild(ta);
  var pb2 = document.createElement('div'); pb2.className = 'pb-field';
  var l2 = document.createElement('label'); l2.textContent = 'Corrective action';
  var ta2 = document.createElement('textarea'); ta2.placeholder = 'Corrective action';
  pb2.appendChild(l2); pb2.appendChild(ta2);
  pb.appendChild(pb1); pb.appendChild(pb2);
  var rads = [ok.querySelector('input'), nok.querySelector('input')];
  rads.forEach(function (r) {
    r.addEventListener('change', function () {
      pb.style.display = (nok.querySelector('input').checked) ? 'block' : 'none';
      if (r.value === 'nok') ta.focus();
    });
  });
  opts.appendChild(ok); opts.appendChild(nok);
  box.appendChild(q); box.appendChild(opts); box.appendChild(pb);
  itemsHost.appendChild(box);
});

var mach = document.getElementById('fMachine'), machWrap = document.getElementById('ifmWrap');
var MACHINES = ["IMM-358T-PC-A1","IMM-358T-PC-A2","IMM-360T-PP-A3","IMM-300T-PP-A4","IMM-258T-PP-A5","IMM-128T-PC-B1","IMM-120T-PP-B2","IMM-208T-PP-B3","IMM-200T-PP-B4","IMM-168T-PP-B5","IMM-128T-PP-B6","IMM-160T-PP-B7","IMM-160T-PP-B8","IMM-208T-PC-C1","IMM-208T-PC-C2","IMM-208T-PC-C3","IMM-208T-PC-C4","IMM-208T-PC-C5","IMM-258T-PC-C6","IMM-258T-PC-C7","IMM-258T-PC-C8","IMM-258T-PC-C9","IMM-250T-PP-C10","IMM-250T-PP-C11"];
MACHINES.forEach(function (m) {
  var o = document.createElement('option'); o.value = m; o.textContent = m; mach.appendChild(o);
});
var oo = document.createElement('option'); oo.value = '__other__'; oo.textContent = 'Other (type manually)'; mach.appendChild(oo);
mach.addEventListener('change', function () {
  if (mach.value === '__other__') { machWrap.style.display = 'block'; document.getElementById('fOtherMachine').focus() }
  else { machWrap.style.display = 'none' }
});
function resetForm() {
  document.querySelectorAll('#items input[type=radio]').forEach(function (r) { r.checked = false });
  document.querySelectorAll('#items .problem-box').forEach(function (p) {
    p.style.display = 'none'; p.querySelectorAll('textarea').forEach(function (t) { t.value = '' });
  });
  document.getElementById('ifmWrap').style.display = 'none';
  document.getElementById('fMachine').value = '';
  document.getElementById('fOtherMachine').value = '';
  document.getElementById('fDate').value = new Date().toISOString().split('T')[0];
}
function buildPayload() {
  var payload = {};
  var firstMissing = '';
  ITEMS.forEach(function (it) {
    var input = document.querySelector('input[name="' + it[0] + '"]:checked');
    if (!input) {
      if (it[2] && !firstMissing) firstMissing = it[1].replace(/<[^>]*>/g, '');
      return;
    }
    if (input.value === 'ok') { payload[it[0]] = 'OK' }
    else {
      var names = document.querySelectorAll('input[name="' + it[0] + '"]');
      var box = names[0].closest('.item').querySelector('.problem-box');
      var tas = box.querySelectorAll('textarea');
      var prob = tas[0].value.trim();
      var action = tas[1].value.trim();
      var text = prob;
      if (action) text += text ? (' | Corrective action: ' + action) : ('Corrective action: ' + action);
      payload[it[0]] = text ? ('Not OK - ' + text) : 'Not OK';
    }
  });
  var dv = document.getElementById('fDate').value;
  if (dv) {
    var dp = dv.split('-');
    payload['date'] = dv;
    payload['date_year'] = dp[0];
    payload['date_month'] = dp[1];
    payload['date_day'] = dp[2];
  }
  if (mach.value === '__other__') {
    payload['machine'] = document.getElementById('fOtherMachine').value.trim();
  } else {
    payload['machine'] = mach.value;
  }
  payload['section'] = sec;
  return { payload: payload, firstMissing: firstMissing };
}

var errMsg = document.getElementById('errMsg'), succMsg = document.getElementById('succMsg');
var submitBtn = document.getElementById('submitBtn');
submitBtn.addEventListener('click', function () {
  errMsg.style.display = 'none'; succMsg.style.display = 'none';
  if (!mach.value) {
    errMsg.textContent = 'Please select a Machine'; errMsg.style.display = 'block'; return;
  }
  if (mach.value === '__other__' && !document.getElementById('fOtherMachine').value.trim()) {
    errMsg.textContent = 'Please type the machine name'; errMsg.style.display = 'block'; return;
  }
  if (!document.getElementById('fDate').value) {
    errMsg.textContent = 'Please enter the Date'; errMsg.style.display = 'block'; return;
  }
  var res = buildPayload();
  if (res.firstMissing) {
    errMsg.textContent = 'Please select OK or Not OK for: ' + res.firstMissing;
    errMsg.style.display = 'block'; return;
  }
  if (WEB_APP_URL.indexOf('YOUR_DEPLOYED_ID_HERE') !== -1) {
    errMsg.textContent = 'Backend not configured: deploy apps-script.gs as a Web App, then set WEB_APP_URL in this file.';
    errMsg.style.display = 'block';
    return;
  }
  submitBtn.classList.add('saving'); submitBtn.disabled = true;
  var body = Object.keys(res.payload).map(function (k) {
    return encodeURIComponent(k) + '=' + encodeURIComponent(res.payload[k]);
  }).join('&');
  fetch(WEB_APP_URL, {
    method: 'POST',
    mode: 'cors',
    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
    body: body
  }).then(function (r) { return r.json(); })
    .then(function (j) {
      submitBtn.classList.remove('saving'); submitBtn.disabled = false;
      if (j && j.status === 'ok') {
        succMsg.style.display = 'block';
        resetForm();
        setTimeout(function () { succMsg.style.display = 'none' }, 5000);
      } else {
        errMsg.textContent = 'Submit failed: ' + (j && j.message ? j.message : 'unknown');
        errMsg.style.display = 'block';
      }
    })
    .catch(function (err) {
      submitBtn.classList.remove('saving'); submitBtn.disabled = false;
      errMsg.textContent = 'Network/CORS error: ' + (err && err.message ? err.message : 'request failed') + '. Check WEB_APP_URL and Apps Script deployment (Execute as: Me, Anyone).';
      errMsg.style.display = 'block';
      console.error('Submit error:', err);
    });
  window.scrollTo(0, 0);
});
document.getElementById('clearBtn').addEventListener('click', function () {
  errMsg.style.display = 'none'; succMsg.style.display = 'none'; resetForm();
});
document.getElementById('fDate').value = new Date().toISOString().split('T')[0];
</script>
</body>
</html>
