<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Daily Maintenance Dashboard - Akij Light Engineering Ltd.</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#f5f3ef;font-family:Segoe UI,Arial,sans-serif;min-height:100vh;color:#222}
.hdr{background:#00565c;padding:10px 16px 8px;text-align:center;border-bottom:4px solid #004448}
.hdr-logo-wrap{display:inline-flex;background:#fff;border-radius:10px;padding:6px 18px;box-shadow:0 2px 8px rgba(0,0,0,.18);margin-bottom:4px}
.hdr-logo{height:20px;width:auto;display:block}
.hdr-text{color:#fff;font-size:17px;font-weight:700;letter-spacing:.5px}
.hdr-sub{color:rgba(255,255,255,.7);font-size:12px;margin-top:2px}
.wrap{max-width:1100px;margin:18px auto;padding:0 12px 40px}
.card{background:#fff;border-radius:10px;padding:22px;box-shadow:0 2px 12px rgba(0,0,0,.1);margin-bottom:16px}
.top-bar{display:flex;gap:14px;align-items:flex-end;flex-wrap:wrap}
.field{display:flex;flex-direction:column;gap:3px;flex:1;min-width:150px}
.field label{font-size:13px;font-weight:600;color:#555}
.field select,.field input[type=date]{padding:8px 10px;border:1.5px solid #ccc;border-radius:6px;font-size:14px}
.field select:focus,.field input:focus{border-color:#005151;outline:none}
.back-link{display:inline-block;margin:16px 0 0;padding:8px 18px;background:#005151;color:#fff;text-decoration:none;border-radius:6px;font-size:13px;font-weight:600;transition:background .2s}
.back-link:hover{background:#003838}
.tbl-wrap{overflow-x:auto;margin-top:10px}
table{width:100%;border-collapse:collapse;font-size:13px}
th{background:#005151;color:#fff;padding:10px 8px;text-align:left;position:sticky;top:0;font-weight:600;cursor:pointer;user-select:none}
th:hover{background:#003838}
td{padding:8px;border-bottom:1px solid #e0e0e0;vertical-align:middle}
tr:hover{background:#f5f5f5}
.sl{text-align:center;font-weight:700;color:#005151;width:40px}
.no-data{text-align:center;padding:40px;color:#888;font-size:15px}
.loading{text-align:center;padding:40px;color:#005151;font-size:15px}
.stat{padding:10px 18px;border-radius:8px;font-size:14px;font-weight:600;color:#fff;min-width:120px;text-align:center}
.stats{display:flex;gap:16px;margin:14px 0;flex-wrap:wrap}
.stat.total{background:#005151}
.stat.done{background:#2e7d32}
.stat.pending{background:#ff9800}
.chart{display:flex;flex-direction:column;gap:7px}
.chart-row{display:flex;align-items:center;gap:10px;font-size:13px}
.chart-label{width:210px;text-align:right;color:#333;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chart-bar-wrap{flex:1;background:#efece8;border-radius:6px;height:24px;overflow:hidden}
.chart-bar{height:100%;background:linear-gradient(90deg,#003838,#005151,#0a7d7d);border-radius:6px;color:#fff;font-weight:700;white-space:nowrap;text-align:right;line-height:24px;padding-right:6px;box-sizing:border-box}
.chart-empty{text-align:center;color:#888;padding:18px;font-size:14px}
</style>
</head>
<body>
<div class="hdr">
<div class="hdr-logo-wrap"><img class="hdr-logo" src="enovar_logo.svg?v=2" alt="Enovar Logo"></div>
<div class="hdr-sub">Maintenance Management System</div>
</div>
<div class="wrap">
<a href="index.html" class="back-link">&#8592; Back to Dashboard</a>
<div class="card" style="margin-top:14px">
<div style="font-size:20px;font-weight:700;color:#005151;margin-bottom:14px">Daily Maintenance Task Dashboard</div>
<div class="top-bar">
<div class="field"><label>Date From</label><input type="date" id="dateFrom"></div>
<div class="field"><label>Date To</label><input type="date" id="dateTo"></div>
<div class="field"><label>Section</label><select id="sectionFilter"><option value="">All Sections</option></select></div>
<div class="field"><label>Machine Name</label><select id="machineFilter"><option value="">All Machines</option></select></div>
</div>
</div>
<div class="card">
<div style="font-size:16px;font-weight:700;color:#005151;margin-bottom:12px">Work by Section</div>
<div id="chart" class="chart"><div class="chart-empty">Loading...</div></div>
</div>
<div class="stats" id="stats">
<div class="stat total" id="stTotal">Loading...</div>
<div class="stat done" id="stDone">&nbsp;</div>
<div class="stat pending" id="stPending">&nbsp;</div>
</div>
<div class="card">
<div class="tbl-wrap">
<table id="dataTable">
<thead><tr>
<th data-col="sl">S/L</th>
<th data-col="date">Date &#x25B4</th>
<th data-col="section">Section</th>
<th data-col="machine">Machine</th>
<th data-col="problem">Problem</th>
<th data-col="action">Action Taken</th>
<th data-col="spare">Spare Parts</th>
<th data-col="person">Person</th>
<th data-col="start">Start</th>
<th data-col="end">End</th>
</tr></thead>
<tbody id="tbody"></tbody>
</table>
<div class="no-data" id="noData" style="display:none">No records found.</div>
<div class="loading" id="loadingMsg">Loading data from Google Sheets...</div>
</div>
</div>
</div>
<script>
var DATA=[];
var CSV_URL='https://docs.google.com/spreadsheets/d/1y1ArRCAvY5SBDtuqfFpLQduwJ2_OzvwrhgWbw1ciwF8/gviz/tq?tqx=out:csv&gid=1523854953';

function parseCSV(text){
  var lines=[],row=[],field='',inQ=false;
  for(var i=0;i<text.length;i++){
    var c=text[i];
    if(inQ){if(c==='"'){if(i+1<text.length&&text[i+1]==='"'){field+='"';i++}else{inQ=false}}else{field+=c}}
    else{if(c==='"'){inQ=true}else if(c===','){row.push(field);field=''}else if(c==='\n'||c==='\r'){if(c==='\r'&&i+1<text.length&&text[i+1]==='\n')i++;row.push(field);field='';if(row.length>1)lines.push(row);row=[]}else{field+=c}}}
  if(field||row.length>0){row.push(field);if(row.length>1)lines.push(row)}
  return lines;
}

function parseDateMMDDYYYY(s){
  var p=s.split('/');
  if(p.length===3){return new Date(parseInt(p[2]),parseInt(p[0])-1,parseInt(p[1]))}
  return new Date(s);
}

function normDate(d){
  if(!d)return '';
  var p=d.split('/');
  if(p.length===3){
    var mm=(p[0].length<2?'0':'')+p[0];
    var dd=(p[1].length<2?'0':'')+p[1];
    return p[2]+'-'+mm+'-'+dd;
  }
  return d;
}

var SECTION_ORDER=["Plastic Unit","LED Unit","Switch & Socket","Circuit Breaker","Home Appliance","PVC Tape","Exhaust Fan","RnD Lab","Tool Room","Utility"];

function normSection(s){
  var t=(s||'').trim();
  if(!t)return '';
  for(var i=0;i<SECTION_ORDER.length;i++){if(t===SECTION_ORDER[i])return t;}
  if(t==='LED')return 'LED Unit';
  var low=t.toLowerCase();
  if(low.indexOf('chiller')!==-1||low.indexOf('comprossor')!==-1||low.indexOf('compressor')!==-1||low.indexOf('cfc')!==-1||low.indexOf('schedule clean')!==-1||low.indexOf('water filter')!==-1||low.indexOf('ac power')!==-1||low.indexOf('clock')!==-1||low.indexOf('store')!==-1||low.indexOf('house keeping')!==-1||low.indexOf('complian')!==-1||low.indexOf('running work')!==-1||low.indexOf('all section')!==-1||low.indexOf('fan setup')!==-1||low.indexOf('sub station')!==-1||low.indexOf('generator')!==-1)return 'Utility';
  if(low.indexOf('qc')!==-1||low.indexOf('check board')!==-1)return 'Switch & Socket';
  if(low.indexOf('cfs')!==-1||low.indexOf('central feeding')!==-1||low.indexOf('silo')!==-1||low.indexOf('crusher')!==-1||low.indexOf('imm')!==-1)return 'Plastic Unit';
  if(low.indexOf('4th floor')!==-1||low.indexOf('hvl')!==-1||low.indexOf('exhaust')!==-1)return 'Exhaust Fan';
  return 'Utility';
}

function loadData(){
  fetch(CSV_URL).then(function(r){return r.text()}).then(function(csv){
    var rows=parseCSV(csv);
    for(var i=1;i<rows.length;i++){
      var r=rows[i];if(!r||r.length<11)continue;
      var date=(r[2]||'').trim();
      var section=normSection(r[3]);
      var machine=(r[4]||'').trim();
      var problem=(r[5]||'').trim();
      var action=(r[6]||'').trim();
      var spare=(r[7]||'').trim();
      var start=(r[8]||'').trim();
      var end=(r[9]||'').trim();
      var person=(r[10]||'').trim();
      if(!date&&!section&&!machine)continue;
      DATA.push({date:date,section:section,machine:machine,problem:problem,action:action,spare:spare,person:person,start:start,end:end});
    }
    document.getElementById('loadingMsg').style.display='none';
    initFilters();
    var last='';
    DATA.forEach(function(r){var n=normDate(r.date);if(n>last)last=n});
    if(last){document.getElementById('dateFrom').value=last;document.getElementById('dateTo').value=last;}
    render();
  }).catch(function(e){
    document.getElementById('loadingMsg').textContent='Failed to load data: '+e.message;
  });
}

function initFilters(){
  var sec=document.getElementById('sectionFilter');
  var mach=document.getElementById('machineFilter');
  var secs={},machs={};
  DATA.forEach(function(r){if(r.section)secs[r.section]=1;if(r.machine)machs[r.machine]=1});
  var ordered=[];
  SECTION_ORDER.forEach(function(s){if(secs[s])ordered.push(s)});
  Object.keys(secs).sort().forEach(function(s){if(ordered.indexOf(s)===-1)ordered.push(s)});
  ordered.forEach(function(s){var o=document.createElement('option');o.value=s;o.textContent=s;sec.appendChild(o)});
  Object.keys(machs).sort().forEach(function(s){var o=document.createElement('option');o.value=s;o.textContent=s;mach.appendChild(o)});
  sec.onchange=render;mach.onchange=render;
  document.getElementById('dateFrom').onchange=render;
  document.getElementById('dateTo').onchange=render;
}

var sortCol='date',sortAsc=false;

function render(){
  var sv=document.getElementById('sectionFilter').value;
  var mv=document.getElementById('machineFilter').value;
  var df=document.getElementById('dateFrom').value;
  var dt=document.getElementById('dateTo').value;
  var filtered=DATA.filter(function(r){
    if(sv&&r.section!==sv)return false;
    if(mv&&r.machine!==mv)return false;
    if(df&&normDate(r.date)<df)return false;
    if(dt&&normDate(r.date)>dt)return false;
    return true;
  });
  renderChart(filtered);
  if(sortCol!=='sl'){
    filtered.sort(function(a,b){
      var av=a[sortCol]||'',bv=b[sortCol]||'';
      if(sortCol==='date'){var da=parseDateMMDDYYYY(av),db=parseDateMMDDYYYY(bv);return sortAsc?da-db:db-da}
      return sortAsc?av.localeCompare(bv):bv.localeCompare(av);
    });
  }
  var tb=document.getElementById('tbody');tb.innerHTML='';
  document.getElementById('noData').style.display=filtered.length?'none':'block';
  document.getElementById('dataTable').style.display=filtered.length?'table':'none';
  filtered.forEach(function(r,i){
    var tr=document.createElement('tr');
    tr.innerHTML='<td class="sl">'+(i+1)+'</td><td>'+esc(r.date)+'</td><td>'+esc(r.section)+'</td><td>'+esc(r.machine)+'</td><td>'+esc(r.problem)+'</td><td>'+esc(r.action)+'</td><td>'+esc(r.spare)+'</td><td>'+esc(r.person)+'</td><td>'+esc(r.start)+'</td><td>'+esc(r.end)+'</td>';
    tb.appendChild(tr);
  });
  document.getElementById('stTotal').textContent='Records: '+filtered.length;
  document.getElementById('stDone').textContent='Completed: '+filtered.length;
  document.getElementById('stPending').textContent='Pending: 0';
  updateSortIndicators();
}

function renderChart(filtered){
  var el=document.getElementById('chart');
  if(!el)return;
  var counts={};
  filtered.forEach(function(r){if(r.section)counts[r.section]=(counts[r.section]||0)+1});
  if(!Object.keys(counts).length){el.innerHTML='<div class="chart-empty">No data to chart.</div>';return}
  var keys=[];
  SECTION_ORDER.forEach(function(s){if(s!=='Utility'&&s!=='Exhaust Fan'&&s!=='Tool Room'&&s!=='RnD Lab'&&counts[s])keys.push(s)});
  Object.keys(counts).sort(function(a,b){return counts[b]-counts[a]||a.localeCompare(b)}).forEach(function(s){if(s==='Utility'||s==='Exhaust Fan'||s==='Tool Room'||s==='RnD Lab')return;if(keys.indexOf(s)===-1)keys.push(s)});
  var max=1;
  keys.forEach(function(k){if(counts[k]>max)max=counts[k]});
  var html='';
  keys.forEach(function(k){
    var pct=Math.round(counts[k]/max*100);
    if(pct<4)pct=4;
    html+='<div class="chart-row"><div class="chart-label" title="'+esc(k)+'">'+esc(k)+'</div><div class="chart-bar-wrap"><div class="chart-bar" style="width:'+pct+'%">'+counts[k]+'</div></div></div>';
  });
  el.innerHTML=html;
}

function updateSortIndicators(){
  var ths=document.querySelectorAll('th[data-col]');
  for(var i=0;i<ths.length;i++){
    var col=ths[i].getAttribute('data-col');
    var txt=ths[i].textContent.replace(/\s*[▴▾]\s*$/,'');
    if(col===sortCol)txt+=sortAsc?' ▴':' ▾';
    ths[i].textContent=txt;
  }
}

document.querySelectorAll('th[data-col]').forEach(function(th){
  th.addEventListener('click',function(){
    var col=this.getAttribute('data-col');
    if(col==='sl')return;
    if(sortCol===col){sortAsc=!sortAsc}else{sortCol=col;sortAsc=true}
    render();
  });
});

function esc(s){return s?s.replace(/&/g,'&amp;').replace(/</g,'&lt;'):''}

loadData();
</script>
</body>
</html>
