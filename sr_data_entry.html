<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Store Requisition - Akij Light Engineering Ltd.</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:'Segoe UI',Roboto,Arial,sans-serif}
body{background:#f5f3ef;min-height:100vh}
.hdr{background:#00565c;padding:14px 16px 12px;text-align:center;border-bottom:4px solid #004448}
.hdr-text{color:#fff;font-size:16px;font-weight:800;letter-spacing:.5px}
.hdr-sub{color:rgba(255,255,255,.7);font-size:12px;margin-top:2px}
.wrap{max-width:820px;margin:28px auto;padding:0 20px}
.back-link{display:inline-block;color:#005151;font-size:14px;font-weight:600;text-decoration:none;margin-bottom:16px}
.back-link:hover{text-decoration:underline}
.card{background:#fff;border:1px solid #ddd;border-radius:12px;padding:24px;box-shadow:0 4px 16px rgba(0,81,81,.08)}
.card h2{color:#005151;font-size:20px;font-weight:700;margin-bottom:4px}
.sec-badge{display:inline-block;background:#005151;color:#fff;font-size:13px;font-weight:700;padding:4px 16px;border-radius:16px;margin-bottom:18px}
.field{margin-bottom:16px}
.field label{display:block;color:#333;font-size:14px;font-weight:600;margin-bottom:6px}
.field .req{color:#e53935}
.field input,.field select,.field textarea{width:100%;padding:10px 12px;border:1px solid #bbb;border-radius:8px;font-size:14px;font-family:inherit;background:#fff}
.field textarea{resize:vertical;min-height:60px}
.row{display:flex;gap:14px}
.row .field{flex:1}
.picker{background:#fafaf8;border:1px solid #eee;border-radius:8px;padding:14px;margin-bottom:10px}
.picker h3{color:#005151;font-size:14px;font-weight:700;margin-bottom:12px}
.pick-grid{display:flex;gap:12px;align-items:flex-end;flex-wrap:wrap}
.pick-grid .field{flex:1;min-width:150px;margin-bottom:0}
.add-btn{background:#005151;color:#fff;border:none;padding:10px 22px;border-radius:8px;font-size:14px;font-weight:700;cursor:pointer;transition:all .2s;white-space:nowrap}
.add-btn:hover{background:#006868}
.add-btn:active{transform:scale(.97)}
.entry-row{display:flex;gap:10px;margin-top:12px}
.tbl-wrap{overflow-x:auto;margin-bottom:10px}
table{width:100%;border-collapse:collapse;font-size:13px}
th{background:#005151;color:#fff;padding:9px 8px;text-align:left;font-weight:600}
td{padding:8px;border-bottom:1px solid #eee;vertical-align:middle}
tr:hover{background:#f7f7f5}
.remove-btn{background:#eee;border:none;padding:6px 12px;border-radius:6px;font-size:12px;font-weight:700;cursor:pointer;color:#c62828}
.remove-btn:hover{background:#ffebee}
.actions{display:flex;gap:12px;margin-top:20px;flex-wrap:wrap}
.submit-btn{background:#005151;color:#fff;border:none;padding:12px 28px;border-radius:8px;font-size:15px;font-weight:700;cursor:pointer;transition:all .2s}
.submit-btn:hover{background:#006868;transform:scale(1.02)}
.submit-btn:active{transform:scale(.97)}
.clear-btn{background:#eee;color:#555;border:none;padding:12px 22px;border-radius:8px;font-size:14px;font-weight:600;cursor:pointer}
.clear-btn:hover{background:#ddd}
.success-msg{display:none;background:#2e7d32;color:#fff;padding:16px;border-radius:8px;text-align:center;font-size:16px;font-weight:600;margin-top:16px}
.error-msg{display:none;background:#e53935;color:#fff;padding:12px;border-radius:8px;text-align:center;font-size:14px;font-weight:600;margin-top:12px}
.no-items{color:#6b7073;font-size:13px;text-align:center;padding:14px;border:1px dashed #ccc;border-radius:8px}
</style>
</head>
<body>
<div class="hdr">
<div class="hdr-text">AKIJ LIGHT ENGINEERING LTD.</div>
<div class="hdr-sub">Maintenance Management System</div>
</div>
<div class="wrap">
<a href="index.html" class="back-link">&larr; Back to Dashboard</a>
<div class="card">
<h2>Store Requisition</h2>
<div class="sec-badge">Material Requisition</div>
<div class="row">
<div class="field">
<label>Date <span class="req">*</span></label>
<input type="date" id="fDate">
</div>
<div class="field">
<label>Requisition No</label>
<input type="text" id="fReqNo" placeholder="Auto generated">
</div>
</div>
<div class="row">
<div class="field">
<label>Requested By <span class="req">*</span></label>
<input type="text" id="fReqBy" placeholder="Name">
</div>
<div class="field">
<label>Department / Section <span class="req">*</span></label>
<select id="fDept">
<option value="">-- Select --</option>
</select>
</div>
</div>
<div class="picker">
<h3>Add Item</h3>
<div class="pick-grid">
<div class="field">
<label>Item <span class="req">*</span></label>
<select id="fItem"><option value="">-- Select Item --</option></select>
</div>
<div class="field">
<label>Code</label>
<input type="text" id="fCode" readonly="" style="background:#f2f2f0">
</div>
<div class="field">
<label>UOM</label>
<input type="text" id="fUom" readonly="" style="background:#f2f2f0">
</div>
<div class="field">
<label>Quantity <span class="req">*</span></label>
<input type="number" id="fQty" min="0.5" step="0.5" placeholder="0">
</div>
<button type="button" class="add-btn" id="addBtn">+ Add</button>
</div>
</div>
<div id="tblHost"></div>
<div class="field">
<label>Remarks / Justification</label>
<textarea id="fRemarks" placeholder="Purpose of requisition, job details, etc."></textarea>
</div>
<div class="actions">
<button type="button" class="submit-btn" id="submitBtn">Submit Requisition</button>
<button type="button" class="clear-btn" id="clearBtn">Clear form</button>
</div>
<div class="success-msg" id="succMsg">Store requisition submitted successfully!</div>
<div class="error-msg" id="errMsg"></div>
</div>
</div>
<script>
var CATALOG=[["Pneumatic Regulator 8*16mm","1771128912","Pices"],["Pneumatic Regulator 6*12mm","1771128915","Pices"],["Pneumatic Muffler 8mm","1771128928","Pices"],["Pneumatic Nipple 6*12mm","1771128906","Pices"],["Pneumatic Nipple 8*12mm","1771128905","Pices"],["Pneumatic Nipple 21*10mm","1771119950","Pices"],["Ceramic Fuse 32A (110*38)","1771122855","Pices"],["Mica Bend Heater, ID-36mm, W-40mm, 230V, 250W","1771122862","Pices"],["Mica Bend Heater, ID-42mm, W-80mm, 230V, 400W","1771122847","Pices"],["Cable Casing with Cover 1 inch","1771120073","Foot"],["Wastage Cotton Jute (White)","1771118965","Kilogram"],["Excel Shaft Dia-40mm,L-10feet","1771124410","Pices"],["Phase failure and phase sequence protection relay AS13(XJ5) V-380V","1771128929","Pices"],["Pneumatic Air Tee 8mm X 10mm","1771128919","Pices"],["Pneumatic Air Tube Pipe 10mm","1771119947","Meter/Metre"],["Pneumatic Air Tube Pipe 06mm","1771122844","Meter/Metre"],["Pneumatic Air Tube Pipe 08mm","1771119946","Meter/Metre"],["Solenoid Valve (2/2 Way,24 v DC)","177177451","Pices"],["Spray Paint Green Color [Hi-Temp] 400 ml","177192168","Pices"],["Hand Gloves - Cotton","1771106902","Pair"],["Emery paper Size-2000 NO","1771124244","Pices"],["Emergency Stop Switch Double NO & NC","1771122853","Pices"],["Kerosene (MRO)","1771106386","Liter"],["Pneumatic Air Hose Nipple, Size: 12mm x 10mm","1771128813","Pices"],["Pneumatic Air Socket 8mm X 10mm","1771128922","Pices"],["Pneumatic Exhaust Muffler 10mm","1771128927","Pices"],["Double-Acting Pneumatic Cylinder, Bore 80mm, Stroke 100mm, Max Pressure 10 bar","1771127463","Pices"]];
var DEPTS=["Maintenance","Plastic Injection","LED","GSS & CB","HAP","Utility","Sub Station","Chiller","Compressor","Quality","Production","General"];
var FORM_ACTION=""; /* Google Form endPoint goes here when available */
var ENTRIES={}; /* Google Form entry ids (e.g. {date:"entry.xxxx", reqby:"entry.yyyy", ...}) */

var lines=[];
var fItem=document.getElementById('fItem'),fCode=document.getElementById('fCode'),fUom=document.getElementById('fUom'),fQty=document.getElementById('fQty');
DEPTS.forEach(function(d){var o=document.createElement('option');o.textContent=d;document.getElementById('fDept').appendChild(o)});
CATALOG.forEach(function(it,i){var o=document.createElement('option');o.value=i;o.textContent=it[0]+' ('+it[1]+')';fItem.appendChild(o)});
fItem.addEventListener('change',function(){
  var i=parseInt(fItem.value,10);
  if(fItem.value===''||isNaN(i)){fCode.value='';fUom.value='';return}
  fCode.value=CATALOG[i][1];fUom.value=CATALOG[i][2];
});
function renderTbl(){
  var host=document.getElementById('tblHost');
  if(!lines.length){host.innerHTML='<div class="no-items">No items added yet. Select an item above and click "+ Add".</div>';return}
  var h='<div class="tbl-wrap"><table><thead><tr><th>S/L</th><th>Item</th><th>Code</th><th>UOM</th><th>Qty</th><th></th></tr></thead><tbody>';
  var tot=0;
  lines.forEach(function(l,i){
    tot+=parseFloat(l.qty)||0;
    h+='<tr><td>'+(i+1)+'</td><td>'+esc(l.item)+'</td><td>'+esc(l.code)+'</td><td>'+esc(l.uom)+'</td><td>'+l.qty+'</td><td><button type="button" class="remove-btn" onclick="removeLine('+i+')">&#10005;</button></td></tr>';
  });
  h+='</tbody></table></div>';
  host.innerHTML=h;
}
function esc(s){return s?s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'):''}
function removeLine(i){lines.splice(i,1);renderTbl()}
function addLine(){
  if(fItem.value===''){shErr('Please select an item');return}
  var q=parseFloat(fQty.value);
  if(!(q>0)){shErr('Please enter a valid quantity');return}
  var i=parseInt(fItem.value,10);
  lines.push({item:CATALOG[i][0],code:CATALOG[i][1],uom:CATALOG[i][2],qty:q});
  fItem.value='';fCode.value='';fUom.value='';fQty.value='';
  renderTbl();
}
document.getElementById('addBtn').addEventListener('click',addLine);
function shErr(m){var e=document.getElementById('errMsg');e.textContent=m;e.style.display='block';setTimeout(function(){e.style.display='none'},5000)}
function shOk(m){var s=document.getElementById('succMsg');s.textContent=m;s.style.display='block';setTimeout(function(){s.style.display='none'},5000)}
function genReqNo(){
  var d=new Date();
  var pad=function(n){return String(n).padStart(2,'0')};
  var n=d.getFullYear()+pad(d.getMonth()+1)+pad(d.getDate())+'-'+pad(d.getHours())+pad(d.getMinutes())+pad(d.getSeconds());
  return 'SR-'+n;
}
document.getElementById('fDate').value=new Date().toISOString().split('T')[0];
document.getElementById('fReqNo').value=genReqNo();
document.getElementById('submitBtn').addEventListener('click',function(){
  var e=document.getElementById('errMsg');e.style.display='none';
  var m=document.getElementById('succMsg');m.style.display='none';
  if(!document.getElementById('fReqBy').value.trim()){shErr('Please enter Requested By');return}
  if(!document.getElementById('fDept').value){shErr('Please select Department');return}
  if(!document.getElementById('fDate').value){shErr('Please enter Date');return}
  if(!lines.length){shErr('Please add at least one item');return}
  if(!FORM_ACTION){
    shErr('Requisition form endpoint is not configured yet.');
    return;
  }
  var itemText=lines.map(function(l){return l.code+' '+l.item+' - '+l.qty+' '+l.uom}).join(' | ');
  var payload={};
  if(ENTRIES.date){var dp=document.getElementById('fDate').value.split('-');payload[ENTRIES.date+'_year']=dp[0];payload[ENTRIES.date+'_month']=String(parseInt(dp[1],10));payload[ENTRIES.date+'_day']=String(parseInt(dp[2],10));}
  if(ENTRIES.reqno)payload[ENTRIES.reqno]=document.getElementById('fReqNo').value;
  if(ENTRIES.reqby)payload[ENTRIES.reqby]=document.getElementById('fReqBy').value.trim();
  if(ENTRIES.dept)payload[ENTRIES.dept]=document.getElementById('fDept').value;
  if(ENTRIES.remarks)payload[ENTRIES.remarks]=document.getElementById('fRemarks').value.trim();
  payload['fvv']='1';
  var body=Object.keys(payload).map(function(k){return encodeURIComponent(k)+'='+encodeURIComponent(payload[k])}).join('&');
  fetch(FORM_ACTION,{method:'POST',mode:'no-cors',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:body})
    .catch(function(){});
  shOk('Store requisition submitted successfully!');
  resetForm();
  window.scrollTo(0,0);
});
document.getElementById('clearBtn').addEventListener('click',function(){resetForm()});
function resetForm(){
  lines=[];
  renderTbl();
  document.getElementById('fReqBy').value='';
  document.getElementById('fDept').value='';
  document.getElementById('fRemarks').value='';
  document.getElementById('fItem').value='';
  document.getElementById('fCode').value='';
  document.getElementById('fUom').value='';
  document.getElementById('fQty').value='';
  document.getElementById('fDate').value=new Date().toISOString().split('T')[0];
  document.getElementById('fReqNo').value=genReqNo();
}
renderTbl();
</script>
</body>
</html>
