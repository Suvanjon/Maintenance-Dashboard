<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Completed Dashboard - Akij Light Engineering Ltd.</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:'Segoe UI',Roboto,Arial,sans-serif}
body{background:#f5f3ef;min-height:100vh}
.hdr{background:#005151;padding:14px 16px 10px;text-align:center;border-bottom:3px solid #003838}
.hdr-text{color:#fff;font-size:17px;font-weight:700;letter-spacing:.5px}
.hdr-sub{color:rgba(255,255,255,.7);font-size:12px;margin-top:2px}
.wrap{max-width:1080px;margin:40px auto;padding:0 20px;text-align:left}
.title{color:#005151;font-size:22px;font-weight:700;margin-bottom:8px}
.section-badge{display:inline-block;background:#005151;color:#fff;font-size:14px;font-weight:700;padding:6px 18px;border-radius:20px;margin-bottom:20px}
.summary{display:flex;gap:14px;flex-wrap:wrap;margin:6px 0 26px}
.stat{flex:1;min-width:150px;background:#fff;border:1px solid #ddd;border-radius:10px;padding:14px 16px;box-shadow:0 2px 10px rgba(0,81,81,.06)}
.stat .num{color:#005151;font-size:26px;font-weight:800}
.stat .lbl{color:#777;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;margin-top:3px}
.dept{background:#fff;border:1px solid #ddd;border-radius:12px;padding:18px 20px;margin-bottom:16px;text-align:left;box-shadow:0 2px 10px rgba(0,81,81,.06)}
.dept h3{color:#005151;font-size:18px;font-weight:700;margin-bottom:12px;padding-bottom:8px;border-bottom:2px solid #005151}
.rec{background:#fafaf8;border:1px solid #eee;border-radius:10px;padding:14px 16px;margin-bottom:12px;text-align:left}
.rec .rhead{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;margin-bottom:8px}
.rec .mach{color:#005151;font-size:15px;font-weight:700}
.status{display:inline-block;padding:3px 12px;border-radius:12px;font-size:12px;font-weight:700}
.status.ok{background:#e0f2e9;color:#2e7d32}
.status.nok{background:#fdecea;color:#c62828}
.rec .rdetail{font-size:13px;color:#555;line-height:1.55}
.rec .rdetail .prob{display:block;color:#b23c17;margin-top:4px}
.empty{background:#fff;border:1px dashed #ccc;border-radius:10px;padding:34px 20px;color:#777;font-size:15px;text-align:center;margin-top:10px}
.back{margin-top:24px;display:inline-block;background:none;border:none;color:#005151;font-size:14px;font-weight:600;cursor:pointer;padding:8px 20px;border-radius:6px;text-decoration:none}
.back:hover{background:rgba(0,81,81,.08)}
.hint{color:#888;font-size:12px;margin-top:8px}
</style>
</head>
<body>
<div class="hdr">
<div class="hdr-text">AKIJ LIGHT ENGINEERING LTD.</div>
<div class="hdr-sub">Maintenance Management System</div>
</div>
<div class="wrap">
<div class="title">Completed Dashboard</div>
<div class="section-badge" id="secBadge"></div>
<div class="summary" id="summary"></div>
<div id="records"></div>
<div class="empty" id="empty">Loading completed preventive maintenance records...</div>
<a class="back" href="index.html">&#8592; Back to Main Menu</a>
<div class="hint" id="hint"></div>
</div>
<script>
// Dashboard reads from the "Preventive Completed" Google Sheet
// that the data-entry web app writes into.
var SID = '1WlWBn58tRCDE3aDkwbUFGoRpcXlN3rbR6hc-vWtJ9Gg';
var SECTION = (new URLSearchParams(location.search).get('section') || 'All Departments').trim();
var ALL = (SECTION.toLowerCase() === 'all' || SECTION.toLowerCase() === 'all departments' || SECTION.toLowerCase() === 'all sections');
var sectionLabel = ALL ? 'All Departments' : SECTION;
document.getElementById('secBadge').textContent = sectionLabel;
document.title = 'Completed Dashboard - ' + sectionLabel;

var raw = null, fetched = false;
function setResp(resp) { raw = resp || null; fetched = true; }
if (window.google && window.google.visualization) {
  try { window.google.visualization.Query.setResponse = setResp; } catch (e) {}
}
var s2 = document.createElement('script');
s2.src = 'https://docs.google.com/spreadsheets/d/' + SID + '/gviz/tq?tqx=out:json;responseHandler:setResp&headers=1&sheet=Sheet1';
document.head.appendChild(s2);
var tries = 0, pollInt = null;
function startPoll() {
  clearInterval(pollInt);
  pollInt = setInterval(function () {
    tries++;
    if (raw || tries > 80) { clearInterval(pollInt); render(); }
  }, 400);
}
s2.onload = startPoll;
startPoll();

function cellVal(v) {
  if (v === null || v === undefined) return '';
  if (typeof v === 'object') { var x = v.v !== undefined ? v.v : v.f; return x === undefined ? '' : String(x); }
  return String(v);
}

function render() {
  var table = (raw && raw.table) || {};
  var cols = table.cols || [];
  var rows = table.rows || [];
  var headers = cols.map(function (c) { return (c && c.label) ? String(c.label) : ''; });

  // Build records
  var records = [];
  rows.forEach(function (rr) {
    var o = {};
    headers.forEach(function (h, i) { o[h] = cellVal(rr[i]); });
    records.push(o);
  });

  // Filter by section (if not ALL)
  if (!ALL) {
    records = records.filter(function (r) {
      return String(r['Section'] || '').toLowerCase() === sectionLabel.toLowerCase();
    });
  }

  // Identify columns
  var machineKey = null, dateKey = null, tsKey = null, sectionKey = null;
  headers.forEach(function (h) {
    var l = h.toLowerCase();
    if (l === 'machine name') machineKey = h;
    else if (l === 'date') dateKey = h;
    else if (l === 'timestamp') tsKey = h;
    else if (l === 'section') sectionKey = h;
  });
  if (!machineKey) machineKey = 'Machine Name';
  if (!dateKey) dateKey = 'Date';
  if (!tsKey) tsKey = 'Timestamp';

  var checkCols = headers.filter(function (h) {
    return h !== machineKey && h !== dateKey && h !== tsKey && h !== sectionKey;
  });

  var ok = 0, nok = 0, total = 0, machineSet = {};
  records.forEach(function (r) {
    var anyNok = false;
    checkCols.forEach(function (k) {
      var v = String(r[k] || '');
      if (v !== '') { total++; if (/not ok/i.test(v)) anyNok = true; }
    });
    if (anyNok) nok++; else ok++;
    var m = r[machineKey] || '';
    if (m) machineSet[m] = true;
  });

  // Summary stats
  var summaryEl = document.getElementById('summary');
  summaryEl.innerHTML = '';
  var stats = [['Records', records.length], ['Machines', Object.keys(machineSet).length], ['Checks OK', ok], ['Checks Not OK', nok]];
  stats.forEach(function (st) {
    var d = document.createElement('div'); d.className = 'stat';
    var n = document.createElement('div'); n.className = 'num'; n.textContent = st[1];
    var l = document.createElement('div'); l.className = 'lbl'; l.textContent = st[0];
    d.appendChild(n); d.appendChild(l); summaryEl.appendChild(d);
  });

  var recEl = document.getElementById('records');
  recEl.innerHTML = '';
  var emptyEl = document.getElementById('empty');
  var hintEl = document.getElementById('hint');
  if (!records.length) {
    emptyEl.style.display = 'block';
    emptyEl.textContent = fetched
      ? 'No completed preventive maintenance records found for "' + sectionLabel + '" yet.'
      : 'No completed preventive maintenance records found yet.';
    hintEl.textContent = '';
    return;
  }
  emptyEl.style.display = 'none';
  hintEl.textContent = 'Each card = one submitted checklist. Red text = a check marked "Not OK" with problem/corrective action.';

  records.forEach(function (r) {
    var card = document.createElement('div'); card.className = 'rec';
    var head = document.createElement('div'); head.className = 'rhead';
    var mach = document.createElement('span'); mach.className = 'mach';
    mach.textContent = r[machineKey] || 'Unknown Machine';
    var dt = r[dateKey] || r[tsKey] || '-';
    var statusTxt = 'OK', statusCls = 'ok';
    checkCols.forEach(function (k) {
      if (/not ok/i.test(String(r[k] || ''))) { statusTxt = 'Not OK'; statusCls = 'nok'; }
    });
    var st = document.createElement('span'); st.className = 'status ' + statusCls; st.textContent = statusTxt;
    var dspan = document.createElement('span'); dspan.className = 'rdetail'; dspan.textContent = 'Date: ' + dt;
    head.appendChild(mach); head.appendChild(st); head.appendChild(dspan);
    card.appendChild(head);

    var det = document.createElement('div'); det.className = 'rdetail';
    var anyDetail = false;
    checkCols.forEach(function (k) {
      var v = String(r[k] || '');
      if (v === '') return;
      anyDetail = true;
      var row = document.createElement('div'); row.className = 'rdetail';
      var lbl = document.createElement('span'); lbl.textContent = k + ': ';
      var val = document.createElement('span');
      if (/not ok/i.test(v)) {
        val.className = 'prob'; val.textContent = 'Not OK — ' + v;
      } else {
        val.textContent = 'OK';
      }
      row.appendChild(lbl); row.appendChild(val);
      det.appendChild(row);
    });
    if (anyDetail) card.appendChild(det);
    recEl.appendChild(card);
  });
}
</script>
</body>
</html>
