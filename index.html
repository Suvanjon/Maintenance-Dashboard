<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Maintenance Portal - Akij Light Engineering Ltd. </title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:'Segoe UI',Roboto,Arial,sans-serif}
body{background:#f5f3ef;min-height:100vh;overflow-x:hidden}
.hdr{background:#005151;padding:14px 16px 10px;text-align:center;border-bottom:3px solid #003838;display:flex;flex-direction:column;align-items:center;gap:6px}
.logo-chip{width:120px;height:120px;border-radius:16px;background:#fff;display:flex;align-items:center;justify-content:center;padding:6px;box-shadow:0 2px 8px rgba(0,0,0,.25)}
.logo-chip img{max-width:100%;max-height:100%;display:block}
.hdr-sub{color:rgba(255,255,255,.7);font-size:12px;margin-top:2px}
#landing{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:82vh;background:#f5f3ef}
.landing-title{color:#005151;font-size:28px;font-weight:700;text-align:center;margin-bottom:6px}
.landing-sub{color:#666;font-size:14px;text-align:center;margin-bottom:40px}
.cards{display:flex;gap:40px;flex-wrap:wrap;justify-content:center;padding:0 20px}
.card-btn{width:300px;height:180px;border-radius:12px;background:#005151;border:3px solid #003838;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;transition:all .3s;position:relative;overflow:hidden;box-shadow:0 8px 32px rgba(0,81,81,.3);text-decoration:none}
.card-btn:hover{background:#006868;transform:scale(1.06);box-shadow:0 12px 40px rgba(0,81,81,.4)}
.card-btn:active{transform:scale(.97)}
.card-btn .icon{font-size:48px;margin-bottom:12px}
.card-btn .label{color:#fff;font-size:16px;font-weight:700;text-align:center;line-height:1.3;padding:0 16px}
.card-btn .arrow{position:absolute;bottom:24px;width:32px;height:32px;border-radius:50%;background:rgba(255,255,255,.2);display:flex;align-items:center;justify-content:center;color:#fff;font-size:18px;transition:background .3s}
.card-btn:hover .arrow{background:rgba(255,255,255,.35)}
.brand{color:#005151;font-size:13px;font-weight:600;text-align:center;margin-top:30px;opacity:.5}
.sub-panel{display:none;flex-direction:column;align-items:center;justify-content:center;min-height:82vh;background:#f5f3ef}
.sub-panel.show{display:flex}
.sub-title{color:#005151;font-size:24px;font-weight:700;text-align:center;margin-bottom:8px}
.sub-desc{color:#666;font-size:14px;text-align:center;margin-bottom:36px}
.sub-cards{display:flex;gap:30px;flex-wrap:wrap;justify-content:center;padding:0 20px}
.sub-btn{width:180px;height:180px;border-radius:50%;background:#005151;border:3px solid #003838;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;transition:all .3s;box-shadow:0 8px 32px rgba(0,81,81,.3);text-decoration:none}
.sub-btn:hover{background:#006868;transform:scale(1.06);box-shadow:0 12px 40px rgba(0,81,81,.4)}
.sub-btn:active{transform:scale(.97)}
.sub-btn .sicon{font-size:36px;margin-bottom:10px}
.sub-btn .slabel{color:#fff;font-size:14px;font-weight:700;text-align:center;line-height:1.3;padding:0 14px}
.sub-back{background:none;border:none;color:#005151;font-size:14px;font-weight:600;cursor:pointer;margin-top:30px;padding:8px 20px;border-radius:6px;transition:background .2s}
.sub-back:hover{background:rgba(0,81,81,.08)}
</style>
</head>
<body>
<div class="hdr">
<div class="logo-chip"><img src="logo.jpg" alt="Akij Light Engineering Ltd. logo"></div>
<div class="hdr-sub">Maintenance Management System</div>
</div>

<div id="landing">
<div class="landing-title">Maintenance Analytics Dashboard</div>
<div class="landing-sub">Select a module to begin</div>
<div class="cards">
<div class="card-btn" onclick="showDaily()">
<div class="icon">&#128295;</div>
<div class="label">Daily Maintenance<br>Task</div>
<div class="arrow">&#10132;</div>
</div>
<div class="card-btn" onclick="showPreventive()">
<div class="icon">&#9989;</div>
<div class="label">Preventive<br>Maintenance</div>
<div class="arrow">&#10132;</div>
</div>
</div>
</div>

<div id="sub-daily" class="sub-panel">
<div class="sub-title">Daily Maintenance Task</div>
<div class="sub-desc">Select an option</div>
<div class="sub-cards">
<a href="data_entry.html" target="_blank" class="sub-btn">
<div class="sicon">&#128221;</div>
<div class="slabel">Data Entry</div>
</a>
<a href="daily_dashboard.html" class="sub-btn">
<div class="sicon">&#128202;</div>
<div class="slabel">Daily Status</div>
</a>
</div>
<button class="sub-back" onclick="goBackFromDaily()">&#8592; Back to Main Menu</button>
</div>

<div id="sub-preventive" class="sub-panel">
<div class="sub-title">Preventive Maintenance</div>
<div class="sub-desc">Select a department</div>
<div class="sub-cards">
<a href="imm_inhouse.html" class="sub-btn">
<div class="sicon">&#9989;</div>
<div class="slabel">IMM Inhouse</div>
</a>
<a href="gss_cb.html" class="sub-btn">
<div class="sicon">&#128295;</div>
<div class="slabel">GSS &amp; CB</div>
</a>
<a href="led.html" class="sub-btn">
<div class="sicon">&#128161;</div>
<div class="slabel">LED</div>
</a>
<a href="hap.html" class="sub-btn">
<div class="sicon">&#128230;</div>
<div class="slabel">HAP</div>
</a>
</div>
<button class="sub-back" onclick="goBackFromPreventive()">&#8592; Back to Main Menu</button>
</div>

<script>
function hideAll(){document.getElementById('landing').style.display='none';document.getElementById('sub-daily').classList.remove('show');document.getElementById('sub-preventive').classList.remove('show')}
function showLanding(){document.getElementById('landing').style.display='flex';window.scrollTo(0,0)}
function showDaily(){hideAll();document.getElementById('sub-daily').classList.add('show');window.scrollTo(0,0)}
function showPreventive(){hideAll();document.getElementById('sub-preventive').classList.add('show');window.scrollTo(0,0)}
function goBackFromDaily(){document.getElementById('sub-daily').classList.remove('show');showLanding()}
function goBackFromPreventive(){document.getElementById('sub-preventive').classList.remove('show');showLanding()}
</script>
</body>
</html>
