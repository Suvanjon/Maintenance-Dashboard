<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sub Station Daily Checking - Data Entry</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:'Inter','Segoe UI',-apple-system,Roboto,Arial,sans-serif}
body{background:
 radial-gradient(1200px 480px at 12% -10%, rgba(42,154,160,.13), transparent 60%),
 radial-gradient(1000px 440px at 108% -18%, rgba(0,86,92,.11), transparent 55%),
 #f4f7f9;min-height:100vh;-webkit-font-smoothing:antialiased}
.hdr{background:linear-gradient(135deg,#0b7f89 0%,#006066 45%,#003c44 100%);padding:15px 18px 13px;text-align:center;position:relative;overflow:hidden}
.hdr:after{content:"";position:absolute;inset:0;background:radial-gradient(700px 180px at 50% -80%,rgba(255,255,255,.2),transparent 70%);pointer-events:none}
.hdr-text{position:relative;color:#fff;font-size:16px;font-weight:700;letter-spacing:.12em;text-transform:uppercase}
.hdr-sub{position:relative;color:rgba(255,255,255,.72);font-size:12px;margin-top:2px}
.wrap{max-width:780px;margin:24px auto;padding:0 18px 48px}
.back-link{display:inline-block;color:#00565c;font-size:14px;font-weight:600;text-decoration:none;margin-bottom:18px;padding:8px 18px;background:#fff;border:1px solid rgba(0,86,92,.28);border-radius:999px;transition:all .2s;box-shadow:0 2px 6px rgba(13,40,58,.05)}
.back-link:hover{background:#00565c;color:#fff;text-decoration:none}
.card{background:#fff;border:4px solid #00565c;border-radius:20px;padding:26px;box-shadow:0 10px 30px rgba(13,40,58,.09)}
.card h2{color:#00565c;font-size:21px;font-weight:800;margin-bottom:6px}
.sec-badge{display:inline-block;background:linear-gradient(135deg,#0b7f89,#00565c);color:#fff;font-size:13px;font-weight:700;padding:5px 18px;border-radius:999px;margin-bottom:20px;box-shadow:0 4px 10px rgba(0,86,92,.2)}
.field{margin-bottom:18px}
.field label{display:block;color:#33475c;font-size:13px;font-weight:600;margin-bottom:7px}
.field .req{color:#e53935}
.field input[type=date],.field select{width:100%;padding:11px 14px;border:1.5px solid #d8e2e6;border-radius:12px;font-size:14px;font-family:inherit;background:#fff;transition:border-color .15s,box-shadow .15s}
.field input[type=date]:focus,.field select:focus{border-color:#0a6b72;outline:none;box-shadow:0 0 0 3px rgba(42,154,160,.16)}
.item{background:#f7fafb;border:1px solid rgba(0,86,92,.4);border-radius:14px;padding:13px 16px;margin-bottom:12px;transition:border-color .15s,box-shadow .15s}
.item:hover{border-color:#cfdfe2;box-shadow:0 2px 8px rgba(13,40,58,.05)}
.item .q{color:#26394a;font-size:14px;font-weight:600;line-height:1.45}
.item .q .req{color:#e53935}
.opts{display:flex;gap:20px;margin-top:10px}
.opt{display:flex;align-items:center;gap:7px;font-size:14px;font-weight:600;cursor:pointer}
.opt input{width:17px;height:17px;cursor:pointer;accent-color:#00565c}
.opt .ok{color:#2e7d32}
.opt .nok{color:#e53935}
.problem-box{display:none;margin-top:10px}
.pb-field{margin-top:9px}
.pb-field label{display:block;color:#b23c17;font-size:13px;font-weight:600;margin-bottom:5px}
.problem-box textarea{width:100%;padding:11px 14px;border:1.5px solid #e0c9c0;border-radius:12px;font-size:14px;font-family:inherit;resize:vertical;min-height:46px;box-sizing:border-box;background:#fffdfc;transition:border-color .15s}
.problem-box textarea:focus{outline:none;border-color:#e65100;box-shadow:0 0 0 3px rgba(230,81,0,.1)}
.reading-input{width:100%;padding:11px 14px;border:1.5px solid #d8e2e6;border-radius:12px;font-size:15px;font-family:inherit;margin-top:10px;box-sizing:border-box;background:#fff;transition:border-color .15s,box-shadow .15s}
.reading-input:focus{outline:none;border-color:#0a6b72;box-shadow:0 0 0 3px rgba(42,154,160,.16)}
.actions{display:flex;gap:12px;margin-top:22px;flex-wrap:wrap}
.submit-btn{background:linear-gradient(135deg,#0b7f89,#00565c);color:#fff;border:none;padding:13px 32px;border-radius:12px;font-size:15px;font-weight:700;cursor:pointer;transition:all .2s;box-shadow:0 8px 18px rgba(0,86,92,.24)}
.submit-btn:hover{transform:translateY(-2px);box-shadow:0 12px 26px rgba(0,86,92,.3)}
.submit-btn:active{transform:translateY(0) scale(.98)}
.clear-btn{background:#eef2f4;color:#5d7283;border:none;padding:13px 24px;border-radius:12px;font-size:14px;font-weight:600;cursor:pointer;transition:all .2s}
.clear-btn:hover{background:#dfe8eb;color:#33475c}
.success-msg{display:none;background:linear-gradient(135deg,#43a047,#2e7d32);color:#fff;padding:16px;border-radius:14px;text-align:center;font-size:16px;font-weight:700;margin-top:18px;box-shadow:0 8px 18px rgba(46,125,50,.25)}
.error-msg{display:none;background:#fff0ee;border:1px solid #ffcdc7;color:#c62828;padding:13px;border-radius:12px;text-align:center;font-size:14px;font-weight:600;margin-top:14px}
</style>
</head>
<body>
<div class="hdr">
<div class="hdr-text">AKIJ LIGHT ENGINEERING LTD.</div>
<div class="hdr-sub">Maintenance Management System</div>
</div>
<div class="wrap">
<a href="index.html" class="back-link" id="backLink">&larr; Back to Previous Page</a>
<div class="card">
<h2 id="pageTitle">Sub Station Daily Checking</h2>
<div class="sec-badge" id="secBadge">Sub Station</div>
<div class="field">
<label>Date <span class="req">*</span></label>
<input type="date" id="fDate" required="">
</div>
<div id="items"></div>
<div class="actions">
<button type="button" class="submit-btn" id="submitBtn">Submit</button>
<button type="button" class="clear-btn" id="clearBtn">Clear form</button>
</div>
<div class="success-msg" id="succMsg"></div>
<div class="error-msg" id="errMsg"></div>
</div>
</div>
<script>
var CONFIGS={
'Sub Station':{
action:'https://docs.google.com/forms/u/0/d/e/1FAIpQLSencfdTok-5_tZrBB-J8aiWNl6685bCYk7ClcJNWNrpHbBqPg/formResponse',
title:'Sub Station Daily Checking',
success:'Sub Station daily checking submitted successfully!',
items:[["entry.538831844","Substation room clean &amp; dry"],["entry.1054792211","Room temperature &amp; ventilation normal"],["entry.1699581924","HT Panel Indication Healthy"],["entry.1813447317","VCB Healthy"],["entry.720518481","Protection Relay Healthy"],["entry.923970122","Transformer Oil Level Normal"],["entry.596779494","Transformer Oil Temperature (Â°C)"],["entry.1388715219","Cooling Fan Working"],["entry.366753566","Breather Silica Gel Condition"],["entry.1514750668","Oil Leakage"],["entry.2004393373","Abnormal Noise/Vibration"],["entry.573730844","LT Panel Healthy"],["entry.864856075","LT Voltage (V)"],["entry.144146257","LT Current (A)"],["entry.832599652","Frequency (Hz)"],["entry.1894083496","Power Factor"],["entry.1791184360","Capacitor Bank Working"],["entry.229430055","DC Panel Healthy"],["entry.214313603","DC All Battery Voltage Checking "],["entry.2004114277","Earthing System OK"],["entry.1951082701","Fire Extinguisher Available"],["entry.1720737898","Any Abnormal Observation"]],
readingIds:{6:'entry.596779494',12:'entry.864856075',13:'entry.144146257',14:'entry.832599652',15:'entry.1894083496'},
readingOnly:{6:1,12:1,13:1,14:1,15:1},
textFields:{21:1}
},
'Compressor':{
action:'https://docs.google.com/forms/u/0/d/e/1FAIpQLSfoQKVGaaxw4A7mmzqp2KAmqjiBwTIQ2qfzM3UKK_L_lgd6DQ/formResponse',
title:'Compressor Daily Checking',
success:'Compressor daily checking submitted successfully!',
items:[["entry.285363324","Compressor Room Clean"],["entry.1952307522","Air Pressure"],["entry.1464937248","Lubricating Oil Level"],["entry.97750340","Oil Leakage"],["entry.285918472","Air Leakage"],["entry.597047713","Cooling Fan Working"],["entry.457519283","Air Filter Clean"],["entry.1592979568","Oil Filter Condition"],["entry.1732896414","Safety Valve"],["entry.487162414","Receiver Tank Pressure"],["entry.1459294832","Auto Drain Working"],["entry.24867408","Running Hours"],["entry.563595847","Emergency Stop OK"],["entry.713331484","Any Abnormal Observation"]],
readingIds:{1:'entry.1952307522',9:'entry.487162414',11:'entry.24867408'},
readingOnly:{1:1,9:1,11:1},
textFields:{13:1}
},
'Chiller':{
action:'https://docs.google.com/forms/u/0/d/e/1FAIpQLScBK84FgesxfPZoj_SgSoFiIaejx4t8garbEnkqkz1XZ9_yXA/formResponse',
title:'Chiller Daily Checking',
success:'Chiller daily checking submitted successfully!',
items:[["entry.1725173731","Set Temperature "],["entry.162123270","  Chilled Water Supply Temperature  "],["entry.1806355400","Normal Water Supply Temperature  "],["entry.1783865579","  Chilled Water Pump Status  "],["entry.385063388","Normal Water Pump Status"],["entry.1692728634","Evaporator Pump Status"],["entry.397270730","  Condenser Water Pump Status  "],["entry.554797427","Cooling Tower Pump Status"],["entry.1400271151","  Cooling Tower Fan Status  "],["entry.542501661","  Water Leakage  "],["entry.196545547","  Abnormal Noise/Vibration  "],["entry.476390128","  Alarm/Fault  "]],
readingIds:{0:'entry.1725173731',1:'entry.162123270',2:'entry.1806355400'},
readingOnly:{0:1,1:1,2:1},requiredReadings:{0:1,1:1,2:1},
textFields:{}
},
'Generator':{
action:'https://docs.google.com/forms/u/0/d/e/1FAIpQLSfr750VgxjRGUoYXSjYs5d7BgXXyHWHIhPj0_B6ImOZ-XenBQ/formResponse',
title:'Generator Daily Checking',
success:'Generator daily checking submitted successfully!',
items:[["entry.1685286118","Generator Room Clean"],["entry.252169353","Fuel Level"],["entry.2134091755","Engine Oil Level"],["entry.1411419102","Coolant Level"],["entry.727333566","Battery Voltage"],["entry.1958954946","Battery Charger Working"],["entry.1282450544","Fuel/Oil/Coolant Leakage"],["entry.1264036346","Air Filter Condition"],["entry.1624975271","Engine Started Normally"],["entry.1950991511","Oil Pressure"],["entry.490605007","Coolant Temperature"],["entry.1093791974","Output Voltage"],["entry.2130864301","Output Current"],["entry.2133766212","Frequency"],["entry.83441520","Running Hours"],["entry.1516173891","ATS Panel Healthy"],["entry.2034390380","Emergency Stop OK"],["entry.1964858042","Any Abnormal Observation"]],
readingIds:{1:'entry.252169353',4:'entry.727333566',9:'entry.1950991511',10:'entry.490605007',11:'entry.1093791974',12:'entry.2130864301',13:'entry.2133766212',14:'entry.83441520'},
readingOnly:{1:1,4:1,9:1,10:1,11:1,12:1,13:1,14:1},
textFields:{17:1}
}
};
var sec=new URLSearchParams(location.search).get('section')||'Sub Station';
var CFG=CONFIGS[sec]||CONFIGS['Sub Station'];
var hashMap={'Sub Station':'sub-dc-ss','Chiller':'sub-dc-ch','Compressor':'sub-dc-cp','Generator':'sub-dc-gen'};
document.getElementById('backLink').href='index.html#'+(hashMap[sec]||'sub-daily-check');
document.getElementById('pageTitle').textContent=CFG.title;
document.getElementById('secBadge').textContent=sec;
document.getElementById('succMsg').textContent=CFG.success;
document.title=CFG.title+' - '+sec;
var ITEMS=CFG.items,READING_IDS=CFG.readingIds,READING_ONLY=CFG.readingOnly,TEXT_FIELDS=CFG.textFields||{};
var itemsHost=document.getElementById('items');
ITEMS.forEach(function(it,idx){
  var box=document.createElement('div');box.className='item';
  var q=document.createElement('div');q.className='q';
  var isReqReading = CFG.requiredReadings && CFG.requiredReadings[String(idx)];
  q.innerHTML=it[1]+(isReqReading?' <span class="req">*</span>':'');
  var reading=null;
  if(READING_IDS[String(idx)]){
    var ri=document.createElement('input');ri.type='number';ri.step='any';ri.className='reading-input';
    ri.placeholder=isReqReading?'Enter reading value':'Enter reading value (optional)';
    box.appendChild(ri);reading=ri;
  }
  var opts=document.createElement('div');opts.className='opts';
  var ok=document.createElement('label');ok.className='opt';
  ok.innerHTML='<input type="radio" name="'+it[0]+'" value="ok"><span class="ok">OK</span>';
  var nok=document.createElement('label');nok.className='opt';
  nok.innerHTML='<input type="radio" name="'+it[0]+'" value="nok"><span class="nok">Not OK</span>';
  var pb=document.createElement('div');pb.className='problem-box';
  var pb1=document.createElement('div');pb1.className='pb-field';
  var l1=document.createElement('label');l1.textContent='Describe the problem';
  var ta=document.createElement('textarea');ta.placeholder='Describe the problem';
  pb1.appendChild(l1);pb1.appendChild(ta);
  var pb2=document.createElement('div');pb2.className='pb-field';
  var l2=document.createElement('label');l2.textContent='Corrective action';
  var ta2=document.createElement('textarea');ta2.placeholder='Corrective action';
  pb2.appendChild(l2);pb2.appendChild(ta2);
  pb.appendChild(pb1);pb.appendChild(pb2);
  var rads=[ok.querySelector('input'),nok.querySelector('input')];
  rads.forEach(function(r){
    r.addEventListener('change',function(){
      pb.style.display=(nok.querySelector('input').checked)?'block':'none';
      if(r.value==='nok')ta.focus();
    });
  });
  opts.appendChild(ok);opts.appendChild(nok);
  box.appendChild(q);
  if(TEXT_FIELDS[String(idx)]){
    var ti=document.createElement('input');ti.type='text';ti.className='reading-input';
    ti.placeholder='Enter observation (or type None)';
    box.appendChild(ti);
  }else if(!READING_ONLY[String(idx)]){
    box.appendChild(opts);box.appendChild(pb);
  }
  itemsHost.appendChild(box);
});
function resetForm(){
  document.querySelectorAll('#items input[type=radio]').forEach(function(r){r.checked=false});
  document.querySelectorAll('#items .problem-box').forEach(function(p){p.style.display='none';p.querySelectorAll('textarea').forEach(function(t){t.value=''})});
  document.querySelectorAll('#items .reading-input').forEach(function(t){t.value=''});
  document.getElementById('fDate').value=new Date().toISOString().split('T')[0];
}
function buildPayload(){
  var payload={};
  var firstMissing='';
  var itemEls=document.querySelectorAll('#items .item');
  ITEMS.forEach(function(it,idx){
    var itemEl=itemEls[idx];
    var reading=itemEl?itemEl.querySelector('.reading-input'):null;
    if(reading&&reading.value){
      payload[it[0]]=reading.value;
      return;
    }
    if(READING_ONLY[String(idx)]){
      if(CFG.requiredReadings && CFG.requiredReadings[String(idx)]){
        if(!firstMissing)firstMissing=it[1].replace(/<[^>]*>/g,'');
      }
      return;
    }
    if(TEXT_FIELDS[String(idx)]){
      if(!firstMissing)firstMissing=it[1].replace(/<[^>]*>/g,'');
      return;
    }
    var input=itemEl?itemEl.querySelector('input[type=radio]:checked'):null;
    if(!input){
      if(!firstMissing)firstMissing=it[1].replace(/<[^>]*>/g,'');
      return;
    }
    if(input.value==='ok'){payload[it[0]]='OK'}
    else{
      var pbx=itemEl.querySelector('.problem-box');
      var tas=pbx.querySelectorAll('textarea');
      var prob=tas[0].value.trim();
      var action=tas[1].value.trim();
      var text=prob;
      if(action)text+=text?(' | Corrective action: '+action):('Corrective action: '+action);
      payload[it[0]]=text?('Not OK - '+text):'Not OK';
    }
  });
  payload['fvv']='1';
  return {payload:payload,firstMissing:firstMissing};
}
var errMsg=document.getElementById('errMsg'),succMsg=document.getElementById('succMsg');
document.getElementById('submitBtn').addEventListener('click',function(){
  errMsg.style.display='none';succMsg.style.display='none';
  if(!document.getElementById('fDate').value){
    errMsg.textContent='Please enter the Date';errMsg.style.display='block';return;
  }
  var res=buildPayload();
  if(res.firstMissing){
    errMsg.textContent='Please select OK or Not OK for: '+res.firstMissing;
    errMsg.style.display='block';return;
  }
  if(!CFG.action){
    errMsg.textContent='Data entry form not configured for this section yet.';errMsg.style.display='block';return;
  }
  var body=Object.keys(res.payload).map(function(k){
    return encodeURIComponent(k)+'='+encodeURIComponent(res.payload[k]);
  }).join('&');
  fetch(CFG.action,{
    method:'POST',
    mode:'no-cors',
    headers:{'Content-Type':'application/x-www-form-urlencoded'},
    body:body
  }).then(function(){
    succMsg.style.display='block';
  }).catch(function(){
    errMsg.textContent='Network error. Please try again.';errMsg.style.display='block';return;
  });
  resetForm();
  setTimeout(function(){succMsg.style.display='none'},5000);
  window.scrollTo(0,0);
});
document.getElementById('clearBtn').addEventListener('click',function(){errMsg.style.display='none';succMsg.style.display='none';resetForm()});
document.getElementById('fDate').value=new Date().toISOString().split('T')[0];
</script>
</body>
</html>
