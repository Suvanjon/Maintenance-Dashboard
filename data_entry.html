<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:'Inter','Segoe UI',-apple-system,Roboto,Arial,sans-serif}
body{background:
 radial-gradient(1200px 480px at 12% -10%, rgba(42,154,160,.13), transparent 60%),

 #f4f7f9;min-height:100vh;color:#12263a;-webkit-font-smoothing:antialiased}
.hdr{background:linear-gradient(135deg,#0b7f89 0%,#006066 45%,#003c44 100%);padding:15px 18px 13px;text-align:center;position:relative;overflow:hidden}

.hdr-text{position:relative;color:#fff;font-size:16px;font-weight:700;letter-spacing:.12em;text-transform:uppercase}
.hdr-sub{position:relative;color:rgba(255,255,255,.72);font-size:12px;margin-top:2px}
.wrap{max-width:720px;margin:22px auto;padding:0 16px 48px}
.back-link{display:inline-block;margin-bottom:16px;padding:9px 20px;background:#fff;color:#00565c;border:1px solid rgba(0,86,92,.3);text-decoration:none;border-radius:999px;font-size:13px;font-weight:600;transition:all .2s;box-shadow:0 2px 6px rgba(13,40,58,.06)}
.back-link:hover{background:#00565c;color:#fff;border-color:#00565c;box-shadow:0 6px 16px rgba(0,86,92,.24)}
.card{background:#fff;border:5px solid #00565c;border-radius:20px;padding:26px;box-shadow:0 10px 30px rgba(13,40,58,.09)}
.card h2{color:#00565c;font-size:21px;font-weight:800;margin-bottom:20px}
.field{margin-bottom:18px}
.field label{display:block;font-size:13px;font-weight:600;color:#33475c;margin-bottom:7px}

.field select,.field input,.field textarea{width:100%;padding:11px 14px;border:1.5px solid #d8e2e6;border-radius:12px;font-size:14px;background:#fff;transition:border-color .15s,box-shadow .15s;font-family:inherit}

.btn:hover{transform:translateY(-2px);box-shadow:0 12px 26px rgba(0,86,92,.3);background:linear-gradient(135deg,#0f96a1,#00565c)}
.btn:active{transform:translateY(0) scale(.98)}
.success-msg{display:none;background:linear-gradient(135deg,#43a047,#2e7d32);color:#fff;padding:16px;border-radius:14px;text-align:center;font-size:16px;font-weight:700;margin-top:18px;box-shadow:0 8px 18px rgba(46,125,50,.25)}
.error-msg{display:none;background:#fff0ee;border:1px solid #ffcdc7;color:#c62828;padding:13px;border-radius:12px;text-align:center;font-size:14px;font-weight:600;margin-top:14px}

</style>
</head>
<body>
<div class="hdr">

</div>
<div class="wrap">

<div class="card">
<h2>Daily Maintenance - Data Entry</h2>
<form id="mainForm" action="https://docs.google.com/forms/d/e/1FAIpQLScfy7359C_3VXHVz6FWQ8pedDX3WzC81spACyUpnrv_HqslGA/formResponse" method="POST">
<div class="field">

<input type="date" name="entry.713877233" id="fDate" required="">
</div>
<div class="field">

</div>
<div class="field">
<label>Action Taken <span class="req">*</span></label>
<textarea name="entry.910944777" id="fAction" required="" placeholder="Describe action taken..."></textarea>
</div>
<div class="field">
<label>Spare Parts Required</label>
<input type="text" name="entry.971706921" id="fSpare" placeholder="Spare parts (if any)">
</div>
<div class="field">
<label>Working Person <span class="req">*</span></label>
<input type="text" name="entry.35703696" id="fPerson" required="" placeholder="Name of person">
</div>
<div class="row">
<div class="field">
<label>Start Time <span class="req">*</span></label>
<input type="time" name="entry.639063494" id="fStart" required="">
</div>
<div class="field">
<label>End Time <span class="req">*</span></label>
<input type="time" name="entry.1162737553" id="fEnd" required="">
</div>
</div>

<input type="hidden" name="fvv" value="1">
<input type="hidden" name="partialResponse" value='[null,null,"8203609132818112779"]'>
<input type="hidden" name="pageHistory" value="0">
<input type="hidden" name="draftResponse" value="[,,]">
<input type="hidden" name="fbzx" value="-3317017233260532449">
<button type="submit" class="btn">Submit Entry</button>
<div class="error-msg" id="errMsg"></div>

</div>
</div><script>
var MACHINES={"In house IMM Section":["IMM-358T-PC-A1","IMM-358T-PC-A2","IMM-360T-PP-A3","IMM-300T-PP-A4","IMM-258T-PP-A5","IMM-128T-PC-B1","IMM-120T-PP-B2","IMM-208T-PP-B3","IMM-200T-PP-B4","IMM-168T-PP-B5","IMM-128T-PP-B6","IMM-160T-PP-B7","IMM-160T-PP-B8","IMM-208T-PC-C1","IMM-208T-PC-C2","IMM-208T-PC-C3","IMM-208T-PC-C4","IMM-208T-PC-C5","IMM-258T-PC-C6","IMM-258T-PC-C7","IMM-258T-PC-C8","IMM-258T-PC-C9","IMM-250T-PP-C10","IMM-250T-PP-C11","Robot 3 Axis-A1","Robot 3 Axis-A2","Robot 3 Axis-A3","Robot 3 Axis-A4","Robot 3 Axis-A5","Robot 3 Axis-B1","Robot 3 Axis-B2","Robot 3 Axis-B3","Robot 3 Axis-B4","Robot 3 Axis-B5","Robot 3 Axis-B6","Robot 3 Axis-B7","Robot 3 Axis-B8","Robot 3 Axis-C1","Robot 3 Axis-C2","Robot 3 Axis-C3","Robot 3 Axis-C4","Robot 3 Axis-C5","Robot 3 Axis-C6","Robot 3 Axis-C7","Robot 3 Axis-C8","Robot 3 Axis-C9","Robot 3 Axis-C10","Robot 3 Axis-C11","Central Feeding System","Crusher Machine-01","Crusher Machine-02","Crusher Machine-03","Crusher Machine-04","Crusher Machine-05","Mixture Machine-01","Silo-IMM-A1","Silo-IMM-A2","Silo-IMM-A3","Silo-IMM-A4","Silo-IMM-A5","Silo-IMM-B1","Silo-IMM-B2","Silo-IMM-B3","Silo-IMM-B4","Silo-IMM-B5","Silo-IMM-B6","Silo-IMM-B7","Silo-IMM-B8","Silo-IMM-C1","Silo-IMM-C2","Silo-IMM-C3","Silo-IMM-C4","Silo-IMM-C5","Silo-IMM-C6","Silo-IMM-C7","Silo-IMM-C8","Silo-IMM-C9","Silo-IMM-C10","Silo-IMM-C11"],"Switch & Socket":["Switch/Socket Assembly Line-1","Switch/Socket Assembly Line-2","Switch/Socket Assembly Line-3","Switch/Socket Assembly Line-4","Pillow Packing Machine-1","Pillow Packing Machine-2","Pillow Packing Machine-3","Pillow Packing Machine-4","Piano Conveyor-1","Piano Conveyor-2","Switch/Socket Belt Stamping Machine-1","Switch/Socket Belt Stamping Machine-2"],"LED":["LED Auto Assembly Machine","LED Auto Packing Machine","LED Shrink Wrapping Machine","LED Semi-Automatic Machine-1","LED Semi-Automatic Machine-2","LED Auto Crimping Machine-1","LED Auto Crimping Machine-2","LED Manual Crimping Machine","LED AC/DC Aging Line","LED Full set Aging Line","LED Conveyor-01","LED Conveyor-02","LED Conveyor-03","LED Conveyor-04","LED Ink Printer Machine-1","LED Ink Printer Machine-2","LED Belt Stamping Machine-1","LED Belt Stamping Machine-2","LED Belt Stamping Machine-3","LED Laser Printer-1","LED Laser Printer-2"],"PVC Tape":["Tape Cutting Machine-1","Tape Cutting Machine-2","Tape single wrapping Machine"],"Circuit Breaker":["MCB-Automatic Short Delay Test","MCB-Automatic Riveting Unit","MCB-Ink Printer machine","MCB-Flip Vertical Unit","MCB-Automatic Instantaneous Unit","MCB-Pad Printing Unit","MCB-Automatic Voltage Withstand Unit","MCB-Automatic Buckle Unit"],"Home Appliance":["HAP - CONVEYOR BELT FOR SMALL HOME APPLIANCE (30 METER)","HAP - CONVEYOR BELT FOR GAS STOVE (30 METER)","HAP - 5 IN 1 QC MACHINE","HAP - FLAME TESTING MACHINE (GAS STOVE)","HAP - SPOT WELDING MACHINE (GAS STOVE)","HAP - GAS LEAKAGE TESTING MACHINE (GAS STOVE)","HAP - TEMPERATURE TESTING MACHINE (ELECTRIC IRON)","HAP - GLUING MACHINE (ELECTRIC COOKER)","HAP - SPOT WELDING MACHINE (ELECTRIC KETTLE)","HAP - CONTINOUS WELDING MACHINE (ELECTRIC KETTLE)","HAP - EDGE BEADING COMBINED MACHINE (ELECTRIC KETTLE)","HAP - GLUING MACHINE FOR HEATING PLATE (ELECTRIC KETTLE)","HAP - LEAK TESTING MACHINE (4 STATION - ELECTRIC KETTLE)","HAP - SEMI AUTO STRAIGHT LINE SEALER (PACKAGING MACHINE)","HAP - AUTOMATIC SIDE SEALING MACHINE (PACKAGING MACHINE)","HAP - AUTOMATIC HEAT SHRINK TUNNEL (PACKAGING MACHINE)","HAP - AUTOMATIC STRAPING MACHINE (PACKAGING MACHINE)","HAP Belt Stamping Machine-1"],"Tool Room":["Lathe Machine","Milling Machine","EDM Machine","Wire Cut Machine"],"Exhaust Fan":["Exhaust Fan Conveyor","Exhaust Fan Laser Printer"],"Utility":["Chiller-1","Chiller-2","Compressor-1","Water Supply Pump"],"RnD Lab":[]};
var sec=document.getElementById('fSection'),mach=document.getElementById('fMachine'),machWrap=document.getElementById('machineWrapper');
Object.keys(MACHINES).sort().forEach(function(s){var o=document.createElement('option');o.value=s;o.textContent=(s==='In house IMM Section'?'Plastic Unit':s==='LED'?'LED Unit':s);sec.appendChild(o)});
sec.addEventListener('change',function(){mach.innerHTML='<option value="">-- Select Machine --</option>';var sel=sec.value;if(sel&&MACHINES[sel]){MACHINES[sel].forEach(function(m){var o=document.createElement('option');o.value=m;o.textContent=m;mach.appendChild(o)});var oo=document.createElement('option');oo.value='__other__';oo.textContent='Other (type manually)';mach.appendChild(oo);machWrap.style.display='block';mach.value=''}else{machWrap.style.display='none'}});
mach.addEventListener('change',function(){
  var wrap=document.getElementById('otherMachineWrap');
  if(mach.value==='__other__'){
    wrap.style.display='block';
    document.getElementById('fOtherMachine').focus();
  }else{
    wrap.style.display='none';
  }
});
var form=document.getElementById('mainForm'),errMsg=document.getElementById('errMsg'),succMsg=document.getElementById('succMsg');
form.addEventListener('submit',function(e){
  errMsg.style.display='none';succMsg.style.display='none';
  if(!sec.value){e.preventDefault();errMsg.textContent='Please select a Section';errMsg.style.display='block';return}
  if(!mach.value){e.preventDefault();errMsg.textContent='Please select a Machine';errMsg.style.display='block';return}
  var otherVal='';
  if(mach.value==='__other__'){
    otherVal=document.getElementById('fOtherMachine').value.trim();
    if(!otherVal){e.preventDefault();errMsg.textContent='Please type the machine name';errMsg.style.display='block';return}
  }
  e.preventDefault();
  var fd=new FormData(form);
  var dv=document.getElementById('fDate').value;
  fd.delete('entry.713877233');
  if(dv){var dp=dv.split('-');fd.append('entry.713877233_year',dp[0]);fd.append('entry.713877233_month',dp[1]);fd.append('entry.713877233_day',dp[2]);}
  if(otherVal){
    fd.set('entry.1679877274','__other_option__');
    fd.append('entry.1679877274.other_option_response',otherVal);
  }
  fd.append('fvv','1');
  fd.append('partialResponse','[null,null,"8203609132818112779"]');
  fd.append('pageHistory','0');
  fd.append('draftResponse','[,,]');
  fd.append('fbzx','-3317017233260532449');
  
  var payload={};
  fd.forEach(function(val,key){payload[key]=val});
  var body=Object.keys(payload).map(function(k){
    return encodeURIComponent(k)+'='+encodeURIComponent(payload[k]);
  }).join('&');
  fetch('https://docs.google.com/forms/d/e/1FAIpQLScfy7359C_3VXHVz6FWQ8pedDX3WzC81spACyUpnrv_HqslGA/formResponse',{
    method:'POST',
    mode:'no-cors',
    headers:{'Content-Type':'application/x-www-form-urlencoded'},
    body:body
  }).then(function(){
    succMsg.style.display='block';
  }).catch(function(){
    errMsg.textContent='Network error. Please try again.';
    errMsg.style.display='block';
    return;
  });
  form.reset();machWrap.style.display='none';
  mach.innerHTML='<option value="">-- Select Machine --</option>';
  var ow=document.getElementById('otherMachineWrap');if(ow)ow.style.display='none';
  document.getElementById('fDate').value=yesterdayStr();
  setTimeout(function(){succMsg.style.display='none'},5000);
});
function yesterdayStr(){
  var d=new Date();d.setDate(d.getDate()-1);
  var m=('0'+(d.getMonth()+1)).slice(-2),dd=('0'+d.getDate()).slice(-2);
  return d.getFullYear()+'-'+m+'-'+dd;
}
document.getElementById('fDate').value=yesterdayStr();
</script>
