<html lang="en"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Data Entry - Daily Maintenance</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:'Segoe UI',Roboto,Arial,sans-serif}
body{background:#f5f3ef;min-height:100vh;color:#222}
.hdr{background:#00565c;padding:14px 16px 12px;text-align:center;border-bottom:4px solid #004448}
.hdr-logo-wrap{display:inline-flex;background:#fff;border-radius:10px;padding:6px 18px;box-shadow:0 2px 8px rgba(0,0,0,.18);margin-bottom:4px}
.hdr-logo{height:34px;width:auto;display:block}
.hdr-text{color:#fff;font-size:17px;font-weight:700;letter-spacing:.5px}
.hdr-sub{color:rgba(255,255,255,.7);font-size:12px;margin-top:2px}
.wrap{max-width:700px;margin:18px auto;padding:0 12px 40px}
.back-link{display:inline-block;margin-bottom:14px;padding:8px 18px;background:#005151;color:#fff;text-decoration:none;border-radius:6px;font-size:13px;font-weight:600;transition:background .2s}
.back-link:hover{background:#003838}
.card{background:#fff;border-radius:10px;padding:24px;box-shadow:0 2px 12px rgba(0,0,0,.1)}
.card h2{color:#005151;font-size:20px;font-weight:700;margin-bottom:20px}
.field{margin-bottom:16px}
.field label{display:block;font-size:13px;font-weight:600;color:#555;margin-bottom:5px}
.field label .req{color:#e53935;margin-left:2px}
.field select,.field input,.field textarea{width:100%;padding:10px 12px;border:1.5px solid #ccc;border-radius:6px;font-size:14px;background:#fff;transition:border-color .2s}
.field select:focus,.field input:focus,.field textarea:focus{border-color:#005151;outline:none}
.field textarea{resize:vertical;min-height:60px}
.row{display:flex;gap:14px}
.row .field{flex:1}
.btn{display:inline-block;padding:12px 32px;background:#005151;color:#fff;border:none;border-radius:8px;font-size:16px;font-weight:700;cursor:pointer;transition:background .2s;margin-top:8px}
.btn:hover{background:#003838}
.btn:active{transform:scale(.97)}
.success-msg{display:none;background:#2e7d32;color:#fff;padding:16px;border-radius:8px;text-align:center;font-size:16px;font-weight:600;margin-top:16px}
.error-msg{display:none;background:#e53935;color:#fff;padding:12px;border-radius:8px;text-align:center;font-size:14px;font-weight:600;margin-top:12px}
#machineWrapper{display:none}
</style>
</head>
<body>
<div class="hdr">
<div class="hdr-logo-wrap"><img class="hdr-logo" src="enovar_logo.svg?v=2" alt="Enovar Logo"></div>
<div class="hdr-sub">Maintenance Management System</div>
</div>
<div class="wrap">
<a href="index.html" class="back-link">← Back to Dashboard</a>
<div class="card">
<h2>Daily Maintenance - Data Entry</h2>
<form id="mainForm" action="https://docs.google.com/forms/d/e/1FAIpQLScfy7359C_3VXHVz6FWQ8pedDX3WzC81spACyUpnrv_HqslGA/formResponse" method="POST">
<div class="field">
<label>Date <span class="req">*</span></label>
<input type="date" name="entry.713877233" id="fDate" required="">
</div>
<div class="field">
<label>Section</label>
<select name="entry.938132357" id="fSection">
<option value="">-- Select Section --</option>
</select>
</div>
<div class="field" id="machineWrapper">
<label>Machine Name <span class="req">*</span></label>
<select name="entry.1679877274" id="fMachine" required="">
<option value="">-- Select Machine --</option>
</select>
</div>
<div class="field" id="otherMachineWrap" style="display:none;">
<label>Machine Name (Manual) <span class="req">*</span></label>
<input type="text" id="fOtherMachine" placeholder="Type machine name...">
</div>
<div class="field">
<label>Problem <span class="req">*</span></label>
<textarea name="entry.1180419638" id="fProblem" required="" placeholder="Describe the problem..."></textarea>
</div>
<div class="field">
<label>Action Taken <span class="req">*</span></label>
<textarea name="entry.910944777" id="fAction" required="" placeholder="Describe action taken..."></textarea>
</div>
<div class="field">
<label>Spare Parts Required</label>
<input type="text" name="entry.971706921" id="fSpare" placeholder="Spare parts (if any)">
</div>
<div class="field">
<label>Working Person <span class="req">*</span></label>
<input type="text" name="entry.35703696" id="fPerson" required="" placeholder="Name of person">
</div>
<div class="row">
<div class="field">
<label>Start Time <span class="req">*</span></label>
<input type="time" name="entry.639063494" id="fStart" required="">
</div>
<div class="field">
<label>End Time <span class="req">*</span></label>
<input type="time" name="entry.1162737553" id="fEnd" required="">
</div>
</div>

<input type="hidden" name="fvv" value="1">
<input type="hidden" name="partialResponse" value='[null,null,"8203609132818112779"]'>
<input type="hidden" name="pageHistory" value="0">
<input type="hidden" name="draftResponse" value="[,,]">
<input type="hidden" name="fbzx" value="-3317017233260532449">
<button type="submit" class="btn">Submit Entry</button>
<div class="error-msg" id="errMsg"></div>
<div class="success-msg" id="succMsg">✓ Entry submitted successfully!</div>
</form>
</div>
</div><script>
var MACHINES={"In house IMM Section":["IMM A1 ( Haitian MA360)","IMM A2 ( Haitian MA300)","IIMM A3 (Chen Hong 258)","IMM A4 ( Haitian MA250)","IMM A5 ( Haitian M250)","IMM B1 ( Haitian MA120)","IMM B2 (Chen Hong 208)","IIMM  B3 ( Haitian MA200)","IMM  B4 (Chen Hsong 168)","IMM  B5 (Chen Hsong 128)","IMM B6 (Haitian MA160)","IMM B7 (Haitian MA160)","IMM A Line Conveyor","IMM B Line Conveyor","Overhead Crane A/B Line","Overhead Crane C/D Line","IMM Robot A1","IMM Robot A2","IMM Robot A3","IMM Robot A4","IMM Robot A5","IMM Robot B1","IMM Robot B2","IMM Robot B3","IMM Robot B4","IMM Robot B5","IMM Robot B6","IMM Robot B7","IMM Silo A1","IMM Silo A2","IMM Silo A3","IMM Silo A4","IMM Silo A5","IMM Silo B1","IMM Silo B2","IMM Silo B3","IMM Silo B4","IMM Silo B5","IMM Silo B6","IMM Silo B7","Central Feeding Unit","Crusher Machine-1","Crusher Machine-2"],"Switch & Socket":["Switch/Socket Assembly Line-1","Switch/Socket Assembly Line-2","Switch/Socket Assembly Line-3","Switch/Socket Assembly Line-4","Pillow Packing Machine-1","Pillow Packing Machine-2","Pillow Packing Machine-3","Pillow Packing Machine-4","Piano Conveyor-1","Piano Conveyor-2","Switch/Socket Belt Stamping Machine-1","Switch/Socket Belt Stamping Machine-2"],"LED":["LED Auto Assembly Machine","LED Auto Packing Machine","LED Shrink Wrapping Machine","LED Semi-Automatic Machine-1","LED Semi-Automatic Machine-2","LED Auto Crimping Machine-1","LED Auto Crimping Machine-2","LED Manual Crimping Machine","LED AC/DC Aging Line","LED Full set Aging Line","LED Conveyor-01","LED Conveyor-02","LED Conveyor-03","LED Conveyor-04","LED Ink Printer Machine-1","LED Ink Printer Machine-2","LED Belt Stamping Machine-1","LED Belt Stamping Machine-2","LED Belt Stamping Machine-3","LED Laser Printer-1","LED Laser Printer-2"],"PVC Tape":["Tape Cutting Machine-1","Tape Cutting Machine-2","Tape single wrapping Machine"],"Circuit Breaker":["MCB-Automatic Short Delay Test","MCB-Automatic Riveting Unit","MCB-Ink Printer machine","MCB-Flip Vertical Unit","MCB-Automatic Instantaneous Unit","MCB-Pad Printing Unit","MCB-Automatic Voltage Withstand Unit","MCB-Automatic Buckle Unit"],"Home Appliance":["HAP - CONVEYOR BELT FOR SMALL HOME APPLIANCE (30 METER)","HAP - CONVEYOR BELT FOR GAS STOVE (30 METER)","HAP - 5 IN 1 QC MACHINE","HAP - FLAME TESTING MACHINE (GAS STOVE)","HAP - SPOT WELDING MACHINE (GAS STOVE)","HAP - GAS LEAKAGE TESTING MACHINE (GAS STOVE)","HAP - TEMPERATURE TESTING MACHINE (ELECTRIC IRON)","HAP - GLUING MACHINE (ELECTRIC COOKER)","HAP - SPOT WELDING MACHINE (ELECTRIC KETTLE)","HAP - CONTINOUS WELDING MACHINE (ELECTRIC KETTLE)","HAP - EDGE BEADING COMBINED MACHINE (ELECTRIC KETTLE)","HAP - GLUING MACHINE FOR HEATING PLATE (ELECTRIC KETTLE)","HAP - LEAK TESTING MACHINE (4 STATION - ELECTRIC KETTLE)","HAP - SEMI AUTO STRAIGHT LINE SEALER (PACKAGING MACHINE)","HAP - AUTOMATIC SIDE SEALING MACHINE (PACKAGING MACHINE)","HAP - AUTOMATIC HEAT SHRINK TUNNEL (PACKAGING MACHINE)","HAP - AUTOMATIC STRAPING MACHINE (PACKAGING MACHINE)","HAP Belt Stamping Machine-1"],"Tool Room":["Lathe Machine","Milling Machine","EDM Machine","Wire Cut Machine"],"Exhaust Fan":["Exhaust Fan Conveyor","Exhaust Fan Laser Printer"],"Utility":["Chiller-1","Chiller-2","Compressor-1","Water Supply Pump"],"RnD Lab":[]};
var sec=document.getElementById('fSection'),mach=document.getElementById('fMachine'),machWrap=document.getElementById('machineWrapper');
Object.keys(MACHINES).sort().forEach(function(s){var o=document.createElement('option');o.value=s;o.textContent=(s==='In house IMM Section'?'Plastic Unit':s==='LED'?'LED Unit':s);sec.appendChild(o)});
sec.addEventListener('change',function(){mach.innerHTML='<option value="">-- Select Machine --</option>';var sel=sec.value;if(sel&&MACHINES[sel]){MACHINES[sel].forEach(function(m){var o=document.createElement('option');o.value=m;o.textContent=m;mach.appendChild(o)});var oo=document.createElement('option');oo.value='__other__';oo.textContent='Other (type manually)';mach.appendChild(oo);machWrap.style.display='block';mach.value=''}else{machWrap.style.display='none'}});
mach.addEventListener('change',function(){
  var wrap=document.getElementById('otherMachineWrap');
  if(mach.value==='__other__'){
    wrap.style.display='block';
    document.getElementById('fOtherMachine').focus();
  }else{
    wrap.style.display='none';
  }
});
var form=document.getElementById('mainForm'),errMsg=document.getElementById('errMsg'),succMsg=document.getElementById('succMsg');
form.addEventListener('submit',function(e){
  errMsg.style.display='none';succMsg.style.display='none';
  if(!sec.value){e.preventDefault();errMsg.textContent='Please select a Section';errMsg.style.display='block';return}
  if(!mach.value){e.preventDefault();errMsg.textContent='Please select a Machine';errMsg.style.display='block';return}
  var otherVal='';
  if(mach.value==='__other__'){
    otherVal=document.getElementById('fOtherMachine').value.trim();
    if(!otherVal){e.preventDefault();errMsg.textContent='Please type the machine name';errMsg.style.display='block';return}
  }
  e.preventDefault();
  var fd=new FormData(form);
  var dv=document.getElementById('fDate').value;
  fd.delete('entry.713877233');
  if(dv){var dp=dv.split('-');fd.append('entry.713877233_year',dp[0]);fd.append('entry.713877233_month',dp[1]);fd.append('entry.713877233_day',dp[2]);}
  if(otherVal){
    fd.set('entry.1679877274','__other_option__');
    fd.append('entry.1679877274.other_option_response',otherVal);
  }
  fd.append('fvv','1');
  fd.append('partialResponse','[null,null,"8203609132818112779"]');
  fd.append('pageHistory','0');
  fd.append('draftResponse','[,,]');
  fd.append('fbzx','-3317017233260532449');
  
  var payload={};
  fd.forEach(function(val,key){payload[key]=val});
  var body=Object.keys(payload).map(function(k){
    return encodeURIComponent(k)+'='+encodeURIComponent(payload[k]);
  }).join('&');
  fetch('https://docs.google.com/forms/d/e/1FAIpQLScfy7359C_3VXHVz6FWQ8pedDX3WzC81spACyUpnrv_HqslGA/formResponse',{
    method:'POST',
    mode:'no-cors',
    headers:{'Content-Type':'application/x-www-form-urlencoded'},
    body:body
  }).then(function(){
    succMsg.style.display='block';
  }).catch(function(){
    errMsg.textContent='Network error. Please try again.';
    errMsg.style.display='block';
    return;
  });
  form.reset();machWrap.style.display='none';
  mach.innerHTML='<option value="">-- Select Machine --</option>';
  var ow=document.getElementById('otherMachineWrap');if(ow)ow.style.display='none';
  document.getElementById('fDate').value=new Date().toISOString().split('T')[0];
  setTimeout(function(){succMsg.style.display='none'},5000);
});
document.getElementById('fDate').value=new Date().toISOString().split('T')[0];
</script>


</body></html>
